name: Bug report
description: Report a reproducible problem with UrbanPlanToolbox
title: "[Bug] "
labels: [bug]
body:
  - type: input
    id: app-version
    attributes:
      label: App version
      description: For example, 0.5.0 Preview.
    validations:
      required: true
  - type: dropdown
    id: channel
    attributes:
      label: Installation channel
      options:
        - Microsoft Store
        - GitHub sideload
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Optional diagnostics
      description: Remove project content, personal data, credentials, and unnecessary local paths. Never upload project files.
