name: Publish Microsoft Store update

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit to package (must already be contained in main)
        required: true
        default: main
        type: string
      submit_for_certification:
        description: Submit the new Store submission for certification
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: microsoft-store-publish
  cancel-in-progress: false

env:
  STORE_PRODUCT_ID: 9MWDPJG1BHKW

jobs:
  build-and-publish:
    name: Build and publish Store package
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025-vs2026
    timeout-minutes: 90

    steps:
      - name: Checkout selected source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Resolve and validate package version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          [xml]$manifest = Get-Content -LiteralPath 'Package.Store.appxmanifest' -Raw
          $packageVersion = [string]$manifest.Package.Identity.Version
          if ($packageVersion -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw "Invalid Store package version: $packageVersion"
          }

          [xml]$project = Get-Content -LiteralPath 'UrbanPlanToolbox.csproj' -Raw
          $projectVersion = @(
            $project.Project.PropertyGroup |
              ForEach-Object { $_.Version } |
              Where-Object { $_ }
          )[0]
          if (-not $projectVersion -or $projectVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw 'UrbanPlanToolbox.csproj must declare a three-part Version.'
          }

          $expectedPackageVersion = "$projectVersion.0"
          if ($packageVersion -ne $expectedPackageVersion) {
            throw "Store manifest and project versions do not match. Manifest=$packageVersion Project=$projectVersion"
          }

          $sourceSha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $sourceSha) {
            throw 'Unable to resolve the checked-out source commit.'
          }

          git fetch origin main --no-tags
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to fetch origin/main for source validation.'
          }
          git merge-base --is-ancestor $sourceSha origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "The selected source commit is not contained in origin/main: $sourceSha"
          }

          "package_version=$packageVersion" >> $env:GITHUB_OUTPUT
          "project_version=$projectVersion" >> $env:GITHUB_OUTPUT
          "source_sha=$sourceSha" >> $env:GITHUB_OUTPUT

      - name: Restore Release dependencies
        shell: pwsh
        run: |
          dotnet restore UrbanPlanToolbox.slnx `
            -p:Configuration=Release `
            -p:Platform=x64

      - name: Run unit tests
        shell: pwsh
        run: dotnet test UrbanPlanToolbox.slnx -c Release -p:Platform=x64 --no-restore --verbosity normal

      - name: Build validated Store upload package
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $outputDirectory = Join-Path $env:RUNNER_TEMP "UrbanPlanToolbox-store-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"

          & ./packaging/Build-StorePackage.ps1 `
            -SourceCommit '${{ steps.version.outputs.source_sha }}' `
            -PackageVersion '${{ steps.version.outputs.package_version }}' `
            -Configuration Release `
            -Platform x64 `
            -OutputDirectory $outputDirectory

          $metadataPath = Join-Path $outputDirectory 'store-package-build.json'
          if (-not (Test-Path -LiteralPath $metadataPath -PathType Leaf)) {
            throw "Missing Store package build metadata: $metadataPath"
          }

          $metadata = Get-Content -LiteralPath $metadataPath -Raw | ConvertFrom-Json
          $packagePath = [string]$metadata.package
          if (-not (Test-Path -LiteralPath $packagePath -PathType Leaf)) {
            throw "Missing generated .msixupload package: $packagePath"
          }

          "package_path=$packagePath" >> $env:GITHUB_OUTPUT
          "artifact_name=UrbanPlanToolbox-Store-$($metadata.packageVersion)" >> $env:GITHUB_OUTPUT
          "sha256=$($metadata.sha256)" >> $env:GITHUB_OUTPUT

      - name: Preserve Store upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.package_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Validate Microsoft Store credentials
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:TENANT_ID)) { $missing += 'AZURE_AD_TENANT_ID' }
          if ([string]::IsNullOrWhiteSpace($env:SELLER_ID)) { $missing += 'SELLER_ID' }
          if ([string]::IsNullOrWhiteSpace($env:CLIENT_ID)) { $missing += 'AZURE_AD_APPLICATION_CLIENT_ID' }
          if ([string]::IsNullOrWhiteSpace($env:CLIENT_SECRET)) { $missing += 'AZURE_AD_APPLICATION_SECRET' }
          if ($missing.Count -gt 0) {
            throw "Missing required GitHub Actions secrets: $($missing -join ', ')"
          }

      - name: Setup Microsoft Store Developer CLI
        uses: microsoft/microsoft-store-apppublisher@v1.1

      - name: Configure Microsoft Store Developer CLI
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        run: |
          msstore reconfigure `
            --tenantId "$env:TENANT_ID" `
            --sellerId "$env:SELLER_ID" `
            --clientId "$env:CLIENT_ID" `
            --clientSecret "$env:CLIENT_SECRET"
          msstore settings --enableTelemetry false

      - name: Verify Store product access
        shell: pwsh
        run: msstore apps get "$env:STORE_PRODUCT_ID"

      - name: Upload as draft Store submission
        if: ${{ inputs.submit_for_certification == false }}
        shell: pwsh
        run: |
          msstore publish "$PWD" `
            --inputFile '${{ steps.package.outputs.package_path }}' `
            --appId "$env:STORE_PRODUCT_ID" `
            --noCommit

      - name: Upload and submit for certification
        if: ${{ inputs.submit_for_certification == true }}
        shell: pwsh
        run: |
          msstore publish "$PWD" `
            --inputFile '${{ steps.package.outputs.package_path }}' `
            --appId "$env:STORE_PRODUCT_ID"

      - name: Show current Store submission status
        continue-on-error: true
        shell: pwsh
        run: msstore submission status "$env:STORE_PRODUCT_ID"

      - name: Write workflow summary
        if: ${{ always() && steps.package.outcome == 'success' }}
        shell: pwsh
        run: |
          $mode = if ('${{ inputs.submit_for_certification }}' -eq 'true') { 'submitted for certification' } else { 'uploaded as draft' }
          @"
          ## Microsoft Store update

          - Source commit: ${{ steps.version.outputs.source_sha }}
          - Version: ${{ steps.version.outputs.package_version }}
          - Product ID: $env:STORE_PRODUCT_ID
          - SHA-256: ${{ steps.package.outputs.sha256 }}
          - Mode: $mode

          Microsoft Store certification remains a separate Partner Center process after submission.
          "@ >> $env:GITHUB_STEP_SUMMARY
