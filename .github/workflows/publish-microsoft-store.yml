name: Publish Microsoft Store update

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit already contained in main
        required: true
        default: main
        type: string
      submit_for_certification:
        description: Submit the existing Store draft for certification
        required: true
        default: false
        type: boolean
      certification_confirmation:
        description: Type SUBMIT to confirm committing the existing Store draft
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: microsoft-store-publish
  cancel-in-progress: false

env:
  STORE_PRODUCT_ID: 9MWDPJG1BHKW

jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout selected source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Validate source and package version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$project = Get-Content -LiteralPath UrbanPlanToolbox.csproj -Raw
          [xml]$githubManifest = Get-Content -LiteralPath Package.appxmanifest -Raw
          [xml]$storeManifest = Get-Content -LiteralPath Package.Store.appxmanifest -Raw
          $projectVersion = @($project.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ })[0]
          if ($projectVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw "UrbanPlanToolbox.csproj Version must use major.minor.patch format; got '$projectVersion'."
          }
          $expectedPackageVersion = "$projectVersion.0"
          $githubPackageVersion = [string]$githubManifest.Package.Identity.Version
          $storePackageVersion = [string]$storeManifest.Package.Identity.Version
          if ($githubPackageVersion -ne $expectedPackageVersion -or $storePackageVersion -ne $expectedPackageVersion) {
            throw "Version mismatch. Project=$projectVersion ExpectedPackage=$expectedPackageVersion GitHubManifest=$githubPackageVersion StoreManifest=$storePackageVersion"
          }
          $sha = (git rev-parse HEAD).Trim()
          git fetch origin main --no-tags
          if ($LASTEXITCODE -ne 0) { throw 'Unable to fetch origin/main.' }
          git merge-base --is-ancestor $sha origin/main
          if ($LASTEXITCODE -ne 0) { throw "Source is not contained in origin/main: $sha" }
          $notesPath = "packaging/store-release-notes/$projectVersion.json"
          if (-not (Test-Path -LiteralPath $notesPath -PathType Leaf)) { throw "Missing $notesPath" }
          "source_sha=$sha" >> $env:GITHUB_OUTPUT
          "product_version=$projectVersion" >> $env:GITHUB_OUTPUT
          "package_version=$expectedPackageVersion" >> $env:GITHUB_OUTPUT
          "release_notes_path=$notesPath" >> $env:GITHUB_OUTPUT

      - name: Validate and normalize Store release notes
        if: inputs.submit_for_certification == false
        id: release_notes
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'store-release-notes.normalized.json'
          & ./packaging/Validate-StoreReleaseNotes.ps1 -Version '${{ steps.version.outputs.product_version }}' -Path '${{ steps.version.outputs.release_notes_path }}' -OutputPath $output
          if (-not (Test-Path -LiteralPath $output -PathType Leaf)) {
            throw 'Release-notes validation completed without producing the normalized output file.'
          }
          $null = Get-Content -LiteralPath $output -Raw | ConvertFrom-Json -ErrorAction Stop
          "normalized_path=$output" >> $env:GITHUB_OUTPUT

      - name: Restore Release dependencies
        if: inputs.submit_for_certification == false
        run: dotnet restore UrbanPlanToolbox.slnx -p:Configuration=Release -p:Platform=x64

      - name: Run unit tests
        if: inputs.submit_for_certification == false
        run: dotnet test UrbanPlanToolbox.slnx -c Release -p:Platform=x64 --no-restore --verbosity normal

      - name: Build validated Store upload package
        if: inputs.submit_for_certification == false
        id: package
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP "UrbanPlanToolbox-store-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          & ./packaging/Build-StorePackage.ps1 -SourceCommit '${{ steps.version.outputs.source_sha }}' -PackageVersion '${{ steps.version.outputs.package_version }}' -Configuration Release -Platform x64 -OutputDirectory $output
          $metadataPath = Join-Path $output 'store-package-build.json'
          if (-not (Test-Path -LiteralPath $metadataPath -PathType Leaf)) {
            throw "Store package build did not produce metadata: $metadataPath"
          }
          $metadata = Get-Content -LiteralPath $metadataPath -Raw | ConvertFrom-Json -ErrorAction Stop
          if ([string]::IsNullOrWhiteSpace([string]$metadata.package) -or
              -not (Test-Path -LiteralPath $metadata.package -PathType Leaf)) {
            throw 'Store package build metadata does not reference an existing package.'
          }
          if ([string]::IsNullOrWhiteSpace([string]$metadata.sha256)) {
            throw 'Store package build metadata does not contain SHA-256.'
          }
          "package_path=$($metadata.package)" >> $env:GITHUB_OUTPUT
          "sha256=$($metadata.sha256)" >> $env:GITHUB_OUTPUT
          "metadata_path=$metadataPath" >> $env:GITHUB_OUTPUT

      - name: Preserve Store deployment artifact
        if: inputs.submit_for_certification == false
        id: artifact
        shell: pwsh
        env:
          PACKAGE_PATH: ${{ steps.package.outputs.package_path }}
          METADATA_PATH: ${{ steps.package.outputs.metadata_path }}
          RELEASE_NOTES_PATH: ${{ steps.release_notes.outputs.normalized_path }}
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'store-deployment-artifact'
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          Copy-Item -LiteralPath $env:PACKAGE_PATH -Destination $directory
          Copy-Item -LiteralPath $env:METADATA_PATH -Destination $directory
          Copy-Item -LiteralPath $env:RELEASE_NOTES_PATH -Destination $directory
          "directory=$directory" >> $env:GITHUB_OUTPUT

      - name: Upload Store deployment artifact
        if: inputs.submit_for_certification == false
        uses: actions/upload-artifact@v7
        with:
          name: UrbanPlanToolbox-Store-${{ steps.version.outputs.package_version }}
          path: ${{ steps.artifact.outputs.directory }}
          if-no-files-found: error
          retention-days: 30

      - name: Validate Microsoft Store credentials
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        run: |
          $missing = @('TENANT_ID','SELLER_ID','CLIENT_ID','CLIENT_SECRET') | Where-Object { [string]::IsNullOrWhiteSpace((Get-Item "env:$_").Value) }
          if ($missing) { throw "Missing required secrets: $($missing -join ', ')" }
          $tenantGuid = [Guid]::Empty
          if (-not [Guid]::TryParse($env:TENANT_ID.Trim(), [ref]$tenantGuid)) { throw 'AZURE_AD_TENANT_ID is invalid.' }
          $clientGuid = [Guid]::Empty
          if (-not [Guid]::TryParse($env:CLIENT_ID.Trim(), [ref]$clientGuid)) { throw 'AZURE_AD_APPLICATION_CLIENT_ID is invalid.' }

      - name: Setup Microsoft Store Developer CLI
        id: setup_store_cli
        uses: microsoft/microsoft-store-apppublisher@v1.1

      - name: Configure Microsoft Store Developer CLI
        id: configure_store_cli
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        run: |
          $arguments = @('reconfigure', '--tenantId', $env:TENANT_ID.Trim(), '--sellerId', $env:SELLER_ID.Trim(), '--clientId', $env:CLIENT_ID.Trim(), '--clientSecret', $env:CLIENT_SECRET)
          & msstore @arguments
          if ($LASTEXITCODE -ne 0) { throw "Microsoft Store CLI reconfiguration failed with exit code $LASTEXITCODE." }
          $arguments = @('settings','--enableTelemetry','false')
          & msstore @arguments
          if ($LASTEXITCODE -ne 0) { throw "Microsoft Store CLI settings failed with exit code $LASTEXITCODE." }

      - name: Verify Store product access
        id: verify_store_access
        shell: pwsh
        run: |
          $arguments = @('apps','get',$env:STORE_PRODUCT_ID)
          & msstore @arguments
          if ($LASTEXITCODE -ne 0) { throw "Microsoft Store product access failed with exit code $LASTEXITCODE." }

      - name: Upload as draft Store submission
        if: inputs.submit_for_certification == false
        shell: pwsh
        env:
          PACKAGE_PATH: ${{ steps.package.outputs.package_path }}
        run: |
          $packageDirectory = Split-Path -Parent $env:PACKAGE_PATH
          $arguments = @('publish',(Get-Location).Path,'--inputDirectory',$packageDirectory,'--appId',$env:STORE_PRODUCT_ID,'--noCommit')
          & msstore @arguments
          if ($LASTEXITCODE -ne 0) { throw "Microsoft Store draft upload failed with exit code $LASTEXITCODE." }

      - name: Update three-language Store release notes
        if: inputs.submit_for_certification == false
        id: update_store_release_notes
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        run: |
          $submissionId = & ./packaging/Update-StoreReleaseNotes.ps1 -ProductId $env:STORE_PRODUCT_ID -ReleaseNotesPath '${{ steps.release_notes.outputs.normalized_path }}' -TenantId $env:TENANT_ID.Trim() -ClientId $env:CLIENT_ID.Trim() -ClientSecret $env:CLIENT_SECRET
          $submissionId = [string]$submissionId
          if ([string]::IsNullOrWhiteSpace($submissionId)) { throw 'Store release-notes update completed without returning a submission ID.' }
          "submission_id=$($submissionId.Trim())" >> $env:GITHUB_OUTPUT

      - name: Validate certification confirmation
        if: inputs.submit_for_certification == true
        shell: pwsh
        run: |
          if ('${{ inputs.certification_confirmation }}' -cne 'SUBMIT') { throw 'Certification confirmation is missing. Type SUBMIT to commit the existing Store draft.' }

      - name: Verify existing Store draft is PendingCommit
        if: inputs.submit_for_certification == true
        id: verify_pending_draft
        shell: pwsh
        run: |
          $arguments = @('submission','status',$env:STORE_PRODUCT_ID)
          $statusOutput = (& msstore @arguments 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "Unable to read Microsoft Store submission status. Exit code: $LASTEXITCODE." }
          if ($statusOutput -notmatch '(?i)\bPendingCommit\b') { throw 'Expected an existing PendingCommit Store draft. Certification submission has been stopped.' }

      - name: Submit existing Store draft for certification
        if: inputs.submit_for_certification == true && steps.verify_pending_draft.outcome == 'success'
        shell: pwsh
        run: |
          $arguments = @('submission', 'publish', $env:STORE_PRODUCT_ID)
          & msstore @arguments
          if ($LASTEXITCODE -ne 0) { throw "Microsoft Store certification submission failed with exit code $LASTEXITCODE." }

      - name: Show current Store submission status
        if: always() && steps.setup_store_cli.outcome == 'success' && steps.configure_store_cli.outcome == 'success' && steps.verify_store_access.outcome == 'success' && (inputs.submit_for_certification == false || steps.verify_pending_draft.outcome == 'success')
        continue-on-error: true
        shell: pwsh
        run: |
          $arguments = @('submission','status',$env:STORE_PRODUCT_ID)
          & msstore @arguments
          if ($LASTEXITCODE -ne 0) { throw "Microsoft Store submission status failed with exit code $LASTEXITCODE." }

      - name: Write workflow summary
        if: always()
        shell: pwsh
        run: |
          $mode = if ('${{ inputs.submit_for_certification }}' -eq 'true') { 'certification submission requested' } else { 'draft package and three-language release notes uploaded' }
          "## Microsoft Store update" >> $env:GITHUB_STEP_SUMMARY
          "- Source commit: ${{ steps.version.outputs.source_sha }}" >> $env:GITHUB_STEP_SUMMARY
          "- Product version: ${{ steps.version.outputs.product_version }}" >> $env:GITHUB_STEP_SUMMARY
          "- Package version: ${{ steps.version.outputs.package_version }}" >> $env:GITHUB_STEP_SUMMARY
          "- Product ID: $env:STORE_PRODUCT_ID" >> $env:GITHUB_STEP_SUMMARY
          "- Mode: $mode" >> $env:GITHUB_STEP_SUMMARY
          if ('${{ inputs.submit_for_certification }}' -eq 'false') {
            "- Package SHA-256: ${{ steps.package.outputs.sha256 }}" >> $env:GITHUB_STEP_SUMMARY
            "- Store draft submission ID: ${{ steps.update_store_release_notes.outputs.submission_id }}" >> $env:GITHUB_STEP_SUMMARY
            "The draft was not submitted for certification." >> $env:GITHUB_STEP_SUMMARY
          }
