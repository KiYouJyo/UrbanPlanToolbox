name: Publish Microsoft Store update

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit already contained in main
        required: true
        default: main
        type: string
      publication_confirmation:
        description: Type PUBLISH followed by the exact product version
        required: true
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: microsoft-store-publish
  cancel-in-progress: false

env:
  STORE_PRODUCT_ID: 9MWDPJG1BHKW
  EXPECTED_LAST_PUBLISHED_SUBMISSION_ID: 1152921505701574155
  PROTECTED_PUBLISHED_SUBMISSION_ID: 1152921505701574155

jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout selected source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Validate source and package version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$project = Get-Content -LiteralPath UrbanPlanToolbox.csproj -Raw
          [xml]$githubManifest = Get-Content -LiteralPath Package.appxmanifest -Raw
          [xml]$storeManifest = Get-Content -LiteralPath Package.Store.appxmanifest -Raw
          $projectVersion = @($project.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ })[0]
          if ($projectVersion -notmatch '^\d+\.\d+\.\d+$') { throw "UrbanPlanToolbox.csproj Version must use major.minor.patch format; got '$projectVersion'." }
          $expectedPackageVersion = "$projectVersion.0"
          $githubPackageVersion = [string]$githubManifest.Package.Identity.Version
          $storePackageVersion = [string]$storeManifest.Package.Identity.Version
          if ($githubPackageVersion -ne $expectedPackageVersion -or $storePackageVersion -ne $expectedPackageVersion) { throw "Version mismatch. Project=$projectVersion ExpectedPackage=$expectedPackageVersion GitHubManifest=$githubPackageVersion StoreManifest=$storePackageVersion" }
          $sha = (git rev-parse HEAD).Trim()
          git fetch origin main --no-tags
          if ($LASTEXITCODE -ne 0) { throw 'Unable to fetch origin/main.' }
          git merge-base --is-ancestor $sha origin/main
          if ($LASTEXITCODE -ne 0) { throw "Source is not contained in origin/main: $sha" }
          $notesPath = "packaging/store-release-notes/$projectVersion.json"
          if (-not (Test-Path -LiteralPath $notesPath -PathType Leaf)) { throw "Missing $notesPath" }
          "source_sha=$sha" >> $env:GITHUB_OUTPUT
          "product_version=$projectVersion" >> $env:GITHUB_OUTPUT
          "package_version=$expectedPackageVersion" >> $env:GITHUB_OUTPUT
          "release_notes_path=$notesPath" >> $env:GITHUB_OUTPUT

      - name: Validate publication confirmation
        shell: pwsh
        run: |
          $expectedConfirmation = "PUBLISH ${{ steps.version.outputs.product_version }}"
          if ('${{ inputs.publication_confirmation }}' -cne $expectedConfirmation) { throw "Publication confirmation is invalid. Type exactly: $expectedConfirmation" }

      - name: Validate and normalize Store release notes
        id: release_notes
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'store-release-notes.normalized.json'
          & ./packaging/Validate-StoreReleaseNotes.ps1 -Version '${{ steps.version.outputs.product_version }}' -Path '${{ steps.version.outputs.release_notes_path }}' -OutputPath $output
          if (-not (Test-Path -LiteralPath $output -PathType Leaf)) { throw 'Release-notes validation completed without producing the normalized output file.' }
          $null = Get-Content -LiteralPath $output -Raw | ConvertFrom-Json -ErrorAction Stop
          "normalized_path=$output" >> $env:GITHUB_OUTPUT

      - name: Restore Release dependencies
        run: dotnet restore UrbanPlanToolbox.slnx -p:Configuration=Release -p:Platform=x64

      - name: Run unit tests
        run: dotnet test UrbanPlanToolbox.slnx -c Release -p:Platform=x64 --no-restore --verbosity normal

      - name: Build validated Store upload package
        id: package
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP "UrbanPlanToolbox-store-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          & ./packaging/Build-StorePackage.ps1 -SourceCommit '${{ steps.version.outputs.source_sha }}' -PackageVersion '${{ steps.version.outputs.package_version }}' -Configuration Release -Platform x64 -OutputDirectory $output
          $metadataPath = Join-Path $output 'store-package-build.json'
          if (-not (Test-Path -LiteralPath $metadataPath -PathType Leaf)) { throw "Store package build did not produce metadata: $metadataPath" }
          $metadata = Get-Content -LiteralPath $metadataPath -Raw | ConvertFrom-Json -ErrorAction Stop
          if ([string]::IsNullOrWhiteSpace([string]$metadata.package) -or -not (Test-Path -LiteralPath $metadata.package -PathType Leaf)) { throw 'Store package build metadata does not reference an existing package.' }
          if ([string]::IsNullOrWhiteSpace([string]$metadata.sha256)) { throw 'Store package build metadata does not contain SHA-256.' }
          "package_path=$($metadata.package)" >> $env:GITHUB_OUTPUT
          "package_file=$([IO.Path]::GetFileName([string]$metadata.package))" >> $env:GITHUB_OUTPUT
          "sha256=$($metadata.sha256)" >> $env:GITHUB_OUTPUT
          "metadata_path=$metadataPath" >> $env:GITHUB_OUTPUT

      - name: Preserve Store deployment artifact
        id: artifact
        shell: pwsh
        env:
          PACKAGE_PATH: ${{ steps.package.outputs.package_path }}
          METADATA_PATH: ${{ steps.package.outputs.metadata_path }}
          RELEASE_NOTES_PATH: ${{ steps.release_notes.outputs.normalized_path }}
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'store-deployment-artifact'
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          Copy-Item -LiteralPath $env:PACKAGE_PATH -Destination $directory
          Copy-Item -LiteralPath $env:METADATA_PATH -Destination $directory
          Copy-Item -LiteralPath $env:RELEASE_NOTES_PATH -Destination $directory
          "directory=$directory" >> $env:GITHUB_OUTPUT

      - name: Upload Store deployment artifact
        uses: actions/upload-artifact@v7
        with:
          name: UrbanPlanToolbox-Store-${{ steps.version.outputs.package_version }}
          path: ${{ steps.artifact.outputs.directory }}
          if-no-files-found: error
          retention-days: 30

      - name: Validate Microsoft Store credentials
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        run: |
          $missing = @('TENANT_ID','SELLER_ID','CLIENT_ID','CLIENT_SECRET') | Where-Object { [string]::IsNullOrWhiteSpace((Get-Item "env:$_").Value) }
          if ($missing) { throw "Missing required secrets: $($missing -join ', ')" }
          $tenantGuid = [Guid]::Empty
          if (-not [Guid]::TryParse($env:TENANT_ID.Trim(), [ref]$tenantGuid)) { throw 'AZURE_AD_TENANT_ID is invalid.' }
          $clientGuid = [Guid]::Empty
          if (-not [Guid]::TryParse($env:CLIENT_ID.Trim(), [ref]$clientGuid)) { throw 'AZURE_AD_APPLICATION_CLIENT_ID is invalid.' }

      - name: Setup Microsoft Store Developer CLI
        id: setup_store_cli
        uses: microsoft/microsoft-store-apppublisher@v1.1

      - name: Configure Microsoft Store Developer CLI
        id: configure_store_cli
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        run: |
          $arguments = @('reconfigure', '--tenantId', $env:TENANT_ID.Trim(), '--sellerId', $env:SELLER_ID.Trim(), '--clientId', $env:CLIENT_ID.Trim(), '--clientSecret', $env:CLIENT_SECRET)
          & msstore @arguments
          if ($LASTEXITCODE -ne 0) { throw "Microsoft Store CLI reconfiguration failed with exit code $LASTEXITCODE." }
          $arguments = @('settings','--enableTelemetry','false')
          & msstore @arguments
          if ($LASTEXITCODE -ne 0) { throw "Microsoft Store CLI settings failed with exit code $LASTEXITCODE." }

      - name: Verify Store product access
        id: verify_store_access
        shell: pwsh
        run: |
          $arguments = @('apps','get',$env:STORE_PRODUCT_ID)
          & msstore @arguments
          if ($LASTEXITCODE -ne 0) { throw "Microsoft Store product access failed with exit code $LASTEXITCODE." }

      - name: Assert Store ready for new submission
        id: store_ready
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        run: |
          $output = & ./packaging/Assert-StoreReadyForNewSubmission.ps1 -ProductId $env:STORE_PRODUCT_ID -ExpectedLastPublishedSubmissionId $env:EXPECTED_LAST_PUBLISHED_SUBMISSION_ID -TenantId $env:TENANT_ID.Trim() -ClientId $env:CLIENT_ID.Trim() -ClientSecret $env:CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) { throw 'Store pre-publication state assertion failed.' }
          $output | ForEach-Object { Write-Output $_ }
          $lastPublished = $output | Where-Object { $_ -like 'last_published_submission_id=*' } | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($lastPublished)) { throw 'Store pre-publication assertion did not return last published submission ID.' }
          "last_published_submission_id=$($lastPublished -replace '^last_published_submission_id=','')" >> $env:GITHUB_OUTPUT

      - name: Upload Store package without committing
        id: upload_store_draft
        shell: pwsh
        env:
          PACKAGE_PATH: ${{ steps.package.outputs.package_path }}
          METADATA_PATH: ${{ steps.package.outputs.metadata_path }}
          EXPECTED_PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath $env:PACKAGE_PATH -PathType Leaf)) { throw "Store package does not exist: $env:PACKAGE_PATH" }
          if ([IO.Path]::GetExtension($env:PACKAGE_PATH) -ine '.msixupload') { throw "Store package must be a .msixupload file: $env:PACKAGE_PATH" }
          $metadata = Get-Content -LiteralPath $env:METADATA_PATH -Raw | ConvertFrom-Json -ErrorAction Stop
          if ([IO.Path]::GetFullPath([string]$metadata.package) -cne [IO.Path]::GetFullPath($env:PACKAGE_PATH)) { throw 'Store package metadata does not reference the package selected for upload.' }
          if ([string]$metadata.packageVersion -cne $env:EXPECTED_PACKAGE_VERSION) { throw "Store package metadata version mismatch: $($metadata.packageVersion)" }
          if ([string]$metadata.manifestIdentity -cne 'JoKiy.UrbanPlanToolbox') { throw "Store package metadata identity mismatch: $($metadata.manifestIdentity)" }
          if ($env:PACKAGE_PATH -notmatch '(?i)x64.*bundle\.msixupload$') { throw "Store package must be the x64 MSIX Bundle upload: $env:PACKAGE_PATH" }
          $directoryPackages = @(Get-ChildItem -LiteralPath (Split-Path -Parent $env:PACKAGE_PATH) -Filter '*.msixupload' -File)
          if ($directoryPackages.Count -ne 1 -or $directoryPackages[0].FullName -cne $env:PACKAGE_PATH) { throw 'Store package directory must contain exactly the selected .msixupload file.' }
          $actualHash = (Get-FileHash -LiteralPath $env:PACKAGE_PATH -Algorithm SHA256).Hash.ToUpperInvariant()
          if ([string]$metadata.sha256 -cne $actualHash) { throw 'Store package SHA-256 does not match build metadata.' }
          $arguments = @('publish', $env:PACKAGE_PATH, '--appId', $env:STORE_PRODUCT_ID, '--noCommit')
          & msstore @arguments
          if ($LASTEXITCODE -ne 0) { throw "Microsoft Store package upload failed with exit code $LASTEXITCODE." }

      - name: Update three-language Store release notes
        id: update_store_release_notes
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        run: |
          $submissionId = (& ./packaging/Update-StoreReleaseNotes.ps1 -ProductId $env:STORE_PRODUCT_ID -ReleaseNotesPath '${{ steps.release_notes.outputs.normalized_path }}' -TenantId $env:TENANT_ID.Trim() -ClientId $env:CLIENT_ID.Trim() -ClientSecret $env:CLIENT_SECRET | Select-Object -Last 1).ToString().Trim()
          if ([string]::IsNullOrWhiteSpace($submissionId)) { throw 'Store release-notes update completed without returning a submission ID.' }
          "submission_id=$submissionId" >> $env:GITHUB_OUTPUT

      - name: Verify Store draft contents
        id: verify_store_draft
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          EXPECTED_SUBMISSION_ID: ${{ steps.update_store_release_notes.outputs.submission_id }}
        run: |
          $packageFileName = '${{ steps.package.outputs.package_file }}'
          & ./packaging/Verify-StoreDraftSubmission.ps1 -ProductId $env:STORE_PRODUCT_ID -ExpectedPackageVersion '${{ steps.version.outputs.package_version }}' -ExpectedPackageFileName $packageFileName -ExpectedReleaseNotesPath '${{ steps.release_notes.outputs.normalized_path }}' -ExpectedSubmissionId $env:EXPECTED_SUBMISSION_ID -TenantId $env:TENANT_ID.Trim() -ClientId $env:CLIENT_ID.Trim() -ClientSecret $env:CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) { throw 'Store draft verification failed.' }
          "verified=true" >> $env:GITHUB_OUTPUT

      - name: Commit verified Store submission for certification
        id: commit_store_submission
        if: steps.verify_store_draft.outcome == 'success'
        shell: pwsh
        run: |
          $arguments = @('submission', 'publish', $env:STORE_PRODUCT_ID)
          & msstore @arguments
          if ($LASTEXITCODE -ne 0) { throw "Microsoft Store submission commit failed with exit code $LASTEXITCODE." }

      - name: Verify committed Store submission status
        id: verify_store_submission_committed
        if: always() && steps.commit_store_submission.outcome != 'skipped'
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          EXPECTED_SUBMISSION_ID: ${{ steps.update_store_release_notes.outputs.submission_id }}
        run: |
          & ./packaging/Verify-StoreSubmissionCommitted.ps1 -ProductId $env:STORE_PRODUCT_ID -ExpectedSubmissionId $env:EXPECTED_SUBMISSION_ID -TenantId $env:TENANT_ID.Trim() -ClientId $env:CLIENT_ID.Trim() -ClientSecret $env:CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) { throw 'Post-commit Store submission status verification failed.' }

      - name: Remove transient Store draft after pre-commit failure
        if: failure() && steps.commit_store_submission.outcome == 'skipped' && steps.update_store_release_notes.outputs.submission_id != ''
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          TRANSIENT_SUBMISSION_ID: ${{ steps.update_store_release_notes.outputs.submission_id }}
        run: |
          & ./packaging/Remove-TransientStoreDraft.ps1 -ProductId $env:STORE_PRODUCT_ID -SubmissionId $env:TRANSIENT_SUBMISSION_ID -ExpectedPackageVersion '${{ steps.version.outputs.package_version }}' -ExpectedPackageFileName '${{ steps.package.outputs.package_file }}' -ProtectedPublishedSubmissionId $env:PROTECTED_PUBLISHED_SUBMISSION_ID -TenantId $env:TENANT_ID.Trim() -ClientId $env:CLIENT_ID.Trim() -ClientSecret $env:CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) { throw 'Transient Store draft cleanup failed.' }

      - name: Write workflow summary
        if: always()
        shell: pwsh
        run: |
          "## Microsoft Store v1.3.1 publication" >> $env:GITHUB_STEP_SUMMARY
          "- Source commit: ${{ steps.version.outputs.source_sha }}" >> $env:GITHUB_STEP_SUMMARY
          "- Product version: ${{ steps.version.outputs.product_version }}" >> $env:GITHUB_STEP_SUMMARY
          "- Package version: ${{ steps.version.outputs.package_version }}" >> $env:GITHUB_STEP_SUMMARY
          "- Package file: ${{ steps.package.outputs.package_file }}" >> $env:GITHUB_STEP_SUMMARY
          "- Package SHA-256: ${{ steps.package.outputs.sha256 }}" >> $env:GITHUB_STEP_SUMMARY
          "- Store Product ID: $env:STORE_PRODUCT_ID" >> $env:GITHUB_STEP_SUMMARY
          "- Last published submission before upload: ${{ steps.store_ready.outputs.last_published_submission_id }}" >> $env:GITHUB_STEP_SUMMARY
          "- New submission ID: ${{ steps.update_store_release_notes.outputs.submission_id }}" >> $env:GITHUB_STEP_SUMMARY
          "- Package verification result: ${{ steps.verify_store_draft.outputs.verified }}" >> $env:GITHUB_STEP_SUMMARY
          "- zh-CN Release Notes verification: verified by API" >> $env:GITHUB_STEP_SUMMARY
          "- ja-JP Release Notes verification: verified by API" >> $env:GITHUB_STEP_SUMMARY
          "- en-US Release Notes verification: verified by API" >> $env:GITHUB_STEP_SUMMARY
          "- Commit command result: ${{ steps.commit_store_submission.outcome }}" >> $env:GITHUB_STEP_SUMMARY
          "- Post-commit submission status: ${{ steps.verify_store_submission_committed.outcome }}" >> $env:GITHUB_STEP_SUMMARY
          "- Certification submission requested: true" >> $env:GITHUB_STEP_SUMMARY
