name: v1.8.2 Dual Publish Orchestrator

on:
  push:
    branches:
      - codex/v1.8.2-webdav-cloud-backup
    paths:
      - .github/workflows/v1.8.2-release-orchestrator.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: v1.8.2-dual-publish-orchestrator
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-2025-vs2026
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: 1.8.2
      RELEASE_TAG: v1.8.2
      FEATURE_BRANCH: codex/v1.8.2-webdav-cloud-backup
    steps:
      - name: Checkout orchestration branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve and validate exact main release commit
        id: source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch origin main --tags --force
          if ($LASTEXITCODE -ne 0) { throw 'Unable to fetch origin/main and tags.' }
          $mainSha = (git rev-parse origin/main).Trim()
          $release = git show "$mainSha`:release/release.json" | ConvertFrom-Json
          if ([string]$release.product.version -cne $env:RELEASE_VERSION) { throw "main release version mismatch: $($release.product.version)" }
          if ([string]$release.product.packageVersion -cne "$env:RELEASE_VERSION.0") { throw "main package version mismatch: $($release.product.packageVersion)" }
          if (-not $release.channels.github.publish -or -not $release.channels.microsoftStore.submit) { throw 'Dual publication is disabled by release/release.json.' }
          "main_sha=$mainSha" >> $env:GITHUB_OUTPUT
          Write-Host "Pinned release source: $mainSha"

      - name: Create immutable v1.8.2 tag on exact main HEAD
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $mainSha = '${{ steps.source.outputs.main_sha }}'
          git fetch origin "refs/tags/$env:RELEASE_TAG`:refs/tags/$env:RELEASE_TAG" 2>$null
          $existing = $null
          git rev-parse -q --verify "refs/tags/$env:RELEASE_TAG" *> $null
          if ($LASTEXITCODE -eq 0) { $existing = (git rev-list -n 1 "refs/tags/$env:RELEASE_TAG").Trim() }
          if ($existing) {
            if ($existing -cne $mainSha) { throw "Existing tag $env:RELEASE_TAG points to $existing, expected $mainSha. Refusing to move a release tag." }
            Write-Host "Tag already exists at the correct commit: $existing"
          }
          else {
            git tag $env:RELEASE_TAG $mainSha
            if ($LASTEXITCODE -ne 0) { throw 'Unable to create local release tag.' }
            git push origin "refs/tags/$env:RELEASE_TAG"
            if ($LASTEXITCODE -ne 0) { throw 'Unable to push release tag.' }
          }

      - name: Dispatch canonical GitHub Release workflow
        id: github_dispatch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $marker = [DateTimeOffset]::UtcNow.AddSeconds(-2)
          gh workflow run publish-github-release.yml --ref main -f version=$env:RELEASE_VERSION -f dry_run=false
          if ($LASTEXITCODE -ne 0) { throw 'Failed to dispatch Publish GitHub Release.' }
          $runId = $null
          for ($i = 0; $i -lt 30 -and -not $runId; $i++) {
            Start-Sleep -Seconds 2
            $json = gh run list --workflow publish-github-release.yml --event workflow_dispatch --branch main --limit 10 --json databaseId,headSha,createdAt,status | ConvertFrom-Json
            $candidate = @($json | Where-Object { $_.headSha -ceq '${{ steps.source.outputs.main_sha }}' -and [DateTimeOffset]$_.createdAt -ge $marker } | Sort-Object { [DateTimeOffset]$_.createdAt } -Descending | Select-Object -First 1)
            if ($candidate.Count -eq 1) { $runId = [string]$candidate[0].databaseId }
          }
          if (-not $runId) { throw 'Dispatched GitHub Release run could not be resolved.' }
          "run_id=$runId" >> $env:GITHUB_OUTPUT
          Write-Host "GitHub Release run: $runId"

      - name: Wait for GitHub Release publication
        shell: pwsh
        run: |
          gh run watch '${{ steps.github_dispatch.outputs.run_id }}' --exit-status
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release workflow failed.' }

      - name: Verify published GitHub release and assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = gh api "repos/${{ github.repository }}/releases/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          if ($release.draft -or $release.prerelease) { throw 'v1.8.2 Release is draft or prerelease.' }
          $expected = @(
            "UrbanPlanToolbox_$env:RELEASE_VERSION.0_x64.msixbundle",
            "UrbanPlanToolbox-v$env:RELEASE_VERSION-x64-one-click.zip",
            'SHA256SUMS.txt'
          )
          $assets = @(gh api "repos/${{ github.repository }}/releases/$($release.id)/assets" | ConvertFrom-Json)
          foreach ($name in $expected) {
            $match = @($assets | Where-Object { $_.name -ceq $name })
            if ($match.Count -ne 1) { throw "Expected exactly one GitHub Release asset named $name; found $($match.Count)." }
            if ([int64]$match[0].size -le 0) { throw "GitHub Release asset is empty: $name" }
          }
          Write-Host "Published GitHub Release id=$($release.id), assets=$($expected -join ', ')"

      - name: Dispatch canonical Microsoft Store publication workflow
        id: store_dispatch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $marker = [DateTimeOffset]::UtcNow.AddSeconds(-2)
          $mainSha = '${{ steps.source.outputs.main_sha }}'
          gh workflow run publish-microsoft-store.yml --ref main -f source_ref=$mainSha -f "publication_confirmation=PUBLISH $env:RELEASE_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to dispatch Microsoft Store publication workflow.' }
          $runId = $null
          for ($i = 0; $i -lt 30 -and -not $runId; $i++) {
            Start-Sleep -Seconds 2
            $json = gh run list --workflow publish-microsoft-store.yml --event workflow_dispatch --branch main --limit 10 --json databaseId,headSha,createdAt,status | ConvertFrom-Json
            $candidate = @($json | Where-Object { $_.headSha -ceq $mainSha -and [DateTimeOffset]$_.createdAt -ge $marker } | Sort-Object { [DateTimeOffset]$_.createdAt } -Descending | Select-Object -First 1)
            if ($candidate.Count -eq 1) { $runId = [string]$candidate[0].databaseId }
          }
          if (-not $runId) { throw 'Dispatched Microsoft Store run could not be resolved.' }
          "run_id=$runId" >> $env:GITHUB_OUTPUT
          Write-Host "Microsoft Store run: $runId"

      - name: Wait for Microsoft Store submission handoff
        shell: pwsh
        run: |
          gh run watch '${{ steps.store_dispatch.outputs.run_id }}' --exit-status
          if ($LASTEXITCODE -ne 0) { throw 'Microsoft Store publication workflow failed.' }

      - name: Record publication summary
        shell: pwsh
        run: |
          @"
          ## v1.8.2 dual publication completed
          - Source main SHA: `${{ steps.source.outputs.main_sha }}`
          - Tag: `$env:RELEASE_TAG`
          - GitHub Release workflow run: `${{ steps.github_dispatch.outputs.run_id }}`
          - Microsoft Store workflow run: `${{ steps.store_dispatch.outputs.run_id }}`
          - Store workflow completed successfully; Partner Center certification/publication may continue asynchronously after submission.
          "@ >> $env:GITHUB_STEP_SUMMARY

      - name: Delete merged temporary feature branch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git push origin --delete $env:FEATURE_BRANCH
          if ($LASTEXITCODE -ne 0) { throw 'Dual publication succeeded, but temporary feature branch cleanup failed.' }
