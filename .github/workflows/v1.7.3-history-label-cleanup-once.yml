name: v1.7.3 history label cleanup (one-off)

on:
  push:
    branches:
      - chore/v1.7.3-post-release-closeout

permissions:
  contents: write

jobs:
  cleanup:
    if: "${{ !contains(github.event.head_commit.message, '[skip history cleanup]') }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout closeout branch
        uses: actions/checkout@v4
        with:
          ref: chore/v1.7.3-post-release-closeout
          fetch-depth: 0

      - name: Normalize stale historical labels
        shell: python
        run: |
          from pathlib import Path

          path = Path('docs/index.html')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '当前公开版本 / 現在の公開バージョン / Current public release',
              '历史版本 / 過去のバージョン / Previous release',
          )

          marker = "  <script>\n    document.querySelectorAll('#version-history article.card')"
          start = text.find(marker)
          if start != -1:
              closing = '  </script>\n'
              end = text.find(closing, start)
              if end == -1:
                  raise SystemExit('history-normalization script closing tag not found')
              text = text[:start] + text[end + len(closing):]

          path.write_text(text, encoding='utf-8')

      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet -- docs/index.html; then
            echo "No history-label changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git commit -m "Normalize historical release labels [skip history cleanup]"
          git push origin HEAD:chore/v1.7.3-post-release-closeout
