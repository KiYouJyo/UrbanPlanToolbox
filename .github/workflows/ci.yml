name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test x64
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine CI change scope
        id: change-scope
        shell: pwsh
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_PUSH_BEFORE_SHA: ${{ github.event.before }}
          CI_HEAD_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $changedFiles = @()
          $classificationError = $null
          $comparisonAvailable = $false

          try {
            switch ($env:CI_EVENT_NAME) {
              'pull_request' {
                $base = $env:CI_PR_BASE_SHA
                $head = $env:CI_PR_HEAD_SHA
              }
              'push' {
                $base = $env:CI_PUSH_BEFORE_SHA
                $head = $env:CI_HEAD_SHA
                if ($base -match '^0{40}$') {
                  throw 'Push before SHA is the all-zero initial-push sentinel.'
                }
              }
              default {
                throw "No reliable changed-files comparison is defined for event '$env:CI_EVENT_NAME'."
              }
            }

            if ([string]::IsNullOrWhiteSpace($base) -or [string]::IsNullOrWhiteSpace($head)) {
              throw 'Base or head SHA is missing.'
            }

            foreach ($sha in @($base, $head)) {
              git cat-file -e "$sha^{commit}"
              if ($LASTEXITCODE -ne 0) {
                throw "Commit is unavailable locally: $sha"
              }
            }

            $changedFiles = @(git -c core.quotepath=false diff --name-only --no-renames $base $head)
            if ($LASTEXITCODE -ne 0) {
              throw "git diff failed with exit code $LASTEXITCODE."
            }
            $comparisonAvailable = $true
          }
          catch {
            $classificationError = $_.Exception.Message
          }

          if ($classificationError) {
            $classification = [pscustomobject]@{
              Scope = 'full'
              Reason = "full CI required because changed files could not be reliably determined: $classificationError"
              Files = @()
            }
          }
          else {
            $classification = & .github/scripts/Get-CiChangeScope.ps1 -ChangedPath $changedFiles
          }

          Write-Host "CI change scope: $($classification.Scope.ToUpperInvariant())"
          Write-Host 'Changed files:'
          if ($changedFiles.Count -eq 0) { Write-Host '  <none>' }
          else { $changedFiles | ForEach-Object { Write-Host "  $_" } }
          Write-Host "Reason: $($classification.Reason)"
          if ($classification.Scope -eq 'full' -and $classification.Files.Count -gt 0) {
            Write-Host 'Full CI required because:'
            $classification.Files | ForEach-Object { Write-Host "  $_" }
          }

          "scope=$($classification.Scope)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "has-comparison=$comparisonAvailable" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if ($comparisonAvailable) {
            "diff-base=$base" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "diff-head=$head" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Check diff whitespace
        if: steps.change-scope.outputs.has-comparison == 'true'
        shell: pwsh
        run: git diff --check '${{ steps.change-scope.outputs.diff-base }}' '${{ steps.change-scope.outputs.diff-head }}'

      - name: Validate CI change classifier
        shell: pwsh
        run: ./\.github/scripts/Test-CiChangeScope.ps1

      - name: Validate release documentation
        shell: pwsh
        run: ./scripts/Test-ReleaseDocumentationConsistency.ps1

      - name: Validate documentation SSOT
        shell: pwsh
        run: ./packaging/Test-DocumentationConsistency.ps1

      - name: Setup .NET
        if: steps.change-scope.outputs.scope == 'full'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Show environment
        if: steps.change-scope.outputs.scope == 'full'
        shell: pwsh
        run: |
          dotnet --info
          dotnet --version
          dotnet msbuild -version
          Write-Host "Runner OS: $env:RUNNER_OS"
          Write-Host "Commit SHA: $env:GITHUB_SHA"
          Write-Host "Ref: $env:GITHUB_REF"

      - name: Restore Release dependencies
        if: steps.change-scope.outputs.scope == 'full'
        shell: pwsh
        run: |
          dotnet restore UrbanPlanToolbox.slnx `
            -p:Configuration=Release `
            -p:Platform=x64

      - name: Run unit tests
        if: steps.change-scope.outputs.scope == 'full'
        shell: pwsh
        run: dotnet test UrbanPlanToolbox.slnx -c Release -p:Platform=x64 --no-restore --verbosity normal

      - name: Build Debug x64
        if: steps.change-scope.outputs.scope == 'full'
        shell: pwsh
        run: dotnet build UrbanPlanToolbox.slnx -c Debug -p:Platform=x64 --no-restore

      - name: Build Release x64
        if: steps.change-scope.outputs.scope == 'full'
        shell: pwsh
        run: dotnet build UrbanPlanToolbox.slnx -c Release -p:Platform=x64 --no-restore

      - name: Verify x64 output
        if: steps.change-scope.outputs.scope == 'full'
        shell: pwsh
        run: |
          $targetFramework = 'net10.0-windows10.0.26100.0'
          $configurations = @('Debug', 'Release')

          foreach ($configuration in $configurations) {
            $outputDirectory = Join-Path $PWD "bin/$configuration/$targetFramework/win-x64"
            $mainAssembly = Join-Path $outputDirectory 'UrbanPlanToolbox.dll'

            if (-not (Test-Path -LiteralPath $outputDirectory -PathType Container)) {
              throw "Missing x64 output directory: $outputDirectory"
            }

            if (-not (Test-Path -LiteralPath $mainAssembly -PathType Leaf)) {
              throw "Missing application assembly: $mainAssembly"
            }
          }

          $x86Outputs = Get-ChildItem -Path (Join-Path $PWD 'bin') -Directory -Recurse -Filter 'win-x86' -ErrorAction SilentlyContinue
          if ($x86Outputs) {
            $paths = $x86Outputs.FullName -join [Environment]::NewLine
            throw "Unexpected win-x86 application output generated:`n$paths"
          }

      - name: Validate PowerShell scripts
        if: steps.change-scope.outputs.scope == 'full'
        shell: pwsh
        run: |
          $scriptFiles = Get-ChildItem -Path packaging -Filter '*.ps1' -File -Recurse
          if ($scriptFiles.Count -eq 0) {
            throw 'No PowerShell scripts found under packaging.'
          }

          foreach ($scriptFile in $scriptFiles) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $scriptFile.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              $details = $errors | ForEach-Object { $_.Message } | Join-String -Separator '; '
              throw "PowerShell syntax errors in $($scriptFile.FullName): $details"
            }
          }

      - name: Validate CMD files
        if: steps.change-scope.outputs.scope == 'full'
        shell: pwsh
        run: |
          $cmdFiles = @(
            'packaging/1-Install-UrbanPlanToolbox.cmd',
            'packaging/2-Uninstall-UrbanPlanToolbox.cmd'
          )

          foreach ($relativePath in $cmdFiles) {
            if (-not (Test-Path -LiteralPath $relativePath -PathType Leaf)) {
              throw "Missing CMD file: $relativePath"
            }

            [byte[]]$bytes = [System.IO.File]::ReadAllBytes((Join-Path $PWD $relativePath))
            if ($bytes | Where-Object { $_ -gt 0x7F }) {
              throw "CMD file is not ASCII: $relativePath"
            }

            if ($bytes.Count -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
              throw "CMD file has a UTF-8 BOM: $relativePath"
            }

            for ($index = 0; $index -lt $bytes.Count; $index++) {
              if ($bytes[$index] -eq 0x0A -and ($index -eq 0 -or $bytes[$index - 1] -ne 0x0D)) {
                throw "CMD file contains a bare LF: $relativePath"
              }

              if ($bytes[$index] -eq 0x0D -and ($index -eq ($bytes.Count - 1) -or $bytes[$index + 1] -ne 0x0A)) {
                throw "CMD file contains a non-CRLF line ending: $relativePath"
              }
            }
          }

      - name: Validate repository contents
        if: steps.change-scope.outputs.scope == 'full'
        shell: pwsh
        run: |
          $trackedFiles = git ls-files
          $forbiddenExtensions = @('.pfx', '.p12', '.cer', '.msix', '.zip', '.key')
          $forbiddenFiles = @()

          foreach ($trackedFile in $trackedFiles) {
            $normalizedPath = $trackedFile.Replace('\', '/')
            $extension = if ($normalizedPath -match '(\.[^./]+)$') {
              $Matches[1].ToLowerInvariant()
            } else {
              ''
            }
            $fileName = ($normalizedPath -split '/')[-1].ToLowerInvariant()

            if ($forbiddenExtensions -contains $extension) {
              $forbiddenFiles += $trackedFile
              continue
            }

            if ($normalizedPath -match '(^|/)(bin|obj|AppPackages|\.vs)(/|$)') {
              $forbiddenFiles += $trackedFile
              continue
            }

            if ($extension -eq '.log' -and $fileName -match '(install|setup|uninstall)') {
              $forbiddenFiles += $trackedFile
            }
          }

          if ($forbiddenFiles.Count -gt 0) {
            $details = $forbiddenFiles -join [Environment]::NewLine
            throw "Forbidden tracked repository contents:`n$details"
          }

          git grep -I -n -E -- '-----BEGIN( [A-Z]+)? PRIVATE KEY-----'
          $grepExitCode = $LASTEXITCODE

          switch ($grepExitCode) {
            0 {
              throw 'Tracked repository files contain a private-key marker.'
            }
            1 {
              Write-Host 'No private-key markers were found.'
            }
            default {
              throw "git grep failed with exit code $grepExitCode."
            }
          }

          exit 0
