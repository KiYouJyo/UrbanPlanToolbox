name: Build v1.8.1 Acceptance Package

on:
  push:
    branches:
      - v1.8.1-fixes

permissions:
  contents: read

concurrency:
  group: acceptance-v1.8.1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-acceptance-package:
    name: Build signed x64 acceptance package
    runs-on: windows-2025-vs2026
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Validate v1.8.1 source metadata
        shell: pwsh
        run: |
          [xml]$project = Get-Content -Raw UrbanPlanToolbox.csproj
          $projectVersion = @($project.Project.PropertyGroup | ForEach-Object Version | Where-Object { $_ })[0]
          $appVersion = (Get-Content Services/AppVersionProvider.cs -Raw | Select-String 'Version = "([^"]+)"' -AllMatches).Matches[0].Groups[1].Value
          [xml]$manifest = Get-Content -Raw Package.appxmanifest
          $manifestVersion = $manifest.Package.Identity.Version
          if ($projectVersion -ne '1.8.1' -or $appVersion -ne '1.8.1' -or $manifestVersion -ne '1.8.1.0') {
            throw "Source version mismatch. Project=$projectVersion App=$appVersion Manifest=$manifestVersion"
          }

      - name: Validate signing configuration
        shell: pwsh
        env:
          RELEASE_CERTIFICATE_BASE64: ${{ secrets.GH_RELEASE_CERTIFICATE_BASE64 }}
          RELEASE_CERTIFICATE_PASSWORD: ${{ secrets.GH_RELEASE_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_CERTIFICATE_BASE64) -or [string]::IsNullOrWhiteSpace($env:RELEASE_CERTIFICATE_PASSWORD)) {
            throw 'GitHub release signing secrets are not configured.'
          }

      - name: Restore and test
        shell: pwsh
        run: |
          dotnet restore UrbanPlanToolbox.slnx -p:Configuration=Release -p:Platform=x64
          dotnet test UrbanPlanToolbox.slnx -c Release -p:Platform=x64 --no-restore

      - name: Build unsigned x64 MSIX bundle
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'UrbanPlanToolbox-AppPackages'
          dotnet build UrbanPlanToolbox.csproj -c Release -p:Platform=x64 -p:GenerateAppxPackageOnBuild=true -p:AppxPackageSigningEnabled=false -p:AppxBundle=Always -p:AppxBundlePlatforms=x64 -p:UapAppxPackageBuildMode=SideloadOnly -p:AppxPackageDir="$output\"
          $bundle = @(Get-ChildItem $output -Recurse -Filter '*.msixbundle') | Select-Object -First 1
          if (-not $bundle) { throw 'MSIX bundle was not produced.' }
          $expected = 'UrbanPlanToolbox_1.8.1.0_x64.msixbundle'
          if ($bundle.Name -ne $expected) { throw "Unexpected bundle name: $($bundle.Name); expected $expected" }
          "BUNDLE_PATH=$($bundle.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "BUNDLE_FILE_NAME=$($bundle.Name)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Sign bundle and export public certificate
        shell: pwsh
        env:
          RELEASE_CERTIFICATE_BASE64: ${{ secrets.GH_RELEASE_CERTIFICATE_BASE64 }}
          RELEASE_CERTIFICATE_PASSWORD: ${{ secrets.GH_RELEASE_CERTIFICATE_PASSWORD }}
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'UrbanPlanToolbox-AcceptanceAssets'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $pfx = Join-Path $work 'release-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:RELEASE_CERTIFICATE_BASE64))
          $securePassword = ConvertTo-SecureString $env:RELEASE_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword
          if ($certificate.Subject -cne 'CN=AppPublisher' -or $certificate.Thumbprint -cne 'BD85AD77A651C86CA01A480C8E9BC64952993F98' -or -not $certificate.HasPrivateKey) {
            throw "Unexpected signing certificate: Subject=$($certificate.Subject); Thumbprint=$($certificate.Thumbprint); HasPrivateKey=$($certificate.HasPrivateKey)"
          }
          $cer = Join-Path $work 'UrbanPlanToolbox-1.8.1-Framework-Dependent.cer'
          Export-Certificate -Cert $certificate -FilePath $cer | Out-Null
          $kitsRoot = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          if ([string]::IsNullOrWhiteSpace($kitsRoot)) { throw 'ProgramFiles(x86) environment variable is unavailable.' }
          $signtool = Get-ChildItem (Join-Path $kitsRoot 'Windows Kits\10\bin') -Recurse -Filter signtool.exe | Where-Object FullName -match '\\x64\\signtool.exe$' | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'x64 signtool.exe was not found.' }
          & $signtool.FullName sign /fd SHA256 /sha1 $certificate.Thumbprint /tr http://timestamp.digicert.com /td SHA256 $env:BUNDLE_PATH
          if ($LASTEXITCODE -ne 0) { throw "signtool sign failed: $LASTEXITCODE" }
          $signature = Get-AuthenticodeSignature -FilePath $env:BUNDLE_PATH
          if (-not $signature.SignerCertificate) { throw "Signed bundle has no Authenticode signer certificate. Status=$($signature.Status)" }
          if ($signature.SignerCertificate.Subject -cne 'CN=AppPublisher' -or $signature.SignerCertificate.Thumbprint -cne $certificate.Thumbprint) {
            throw "Signed bundle signer mismatch: Subject=$($signature.SignerCertificate.Subject); Thumbprint=$($signature.SignerCertificate.Thumbprint)"
          }
          if ($signature.Status -eq 'UnknownError') {
            if ($signature.StatusMessage -notmatch '(?i)not trusted|trust provider|untrusted|self-signed') { throw "Unexpected Authenticode status: $($signature.StatusMessage)" }
          }
          elseif ($signature.Status -ne 'Valid') {
            throw "Signed bundle Authenticode status is not acceptable: $($signature.Status) / $($signature.StatusMessage)"
          }
          "CERTIFICATE_PATH=$cer" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Generate and validate one-click acceptance package
        shell: pwsh
        run: |
          $assets = Join-Path $env:RUNNER_TEMP 'UrbanPlanToolbox-AcceptanceAssets'
          $staging = Join-Path $assets 'staging'
          & ./packaging/New-GitHubOneClickInstallerPackage.ps1 -SignedBundlePath $env:BUNDLE_PATH -PublicCertificatePath $env:CERTIFICATE_PATH -OutputDirectory $staging -DisplayVersion '1.8.1' -PackageVersion '1.8.1.0'
          $packageRoot = Join-Path $staging 'UrbanPlanToolbox-v1.8.1-x64-one-click'
          & ./packaging/Test-GitHubOneClickInstallerPackage.ps1 -ReleaseDirectory $packageRoot
          $zip = Join-Path $assets 'UrbanPlanToolbox-v1.8.1-x64-one-click.zip'
          Compress-Archive -LiteralPath $packageRoot -DestinationPath $zip -CompressionLevel Optimal
          $extracted = Join-Path $assets 'extracted'
          Expand-Archive -LiteralPath $zip -DestinationPath $extracted -Force
          & ./packaging/Test-GitHubOneClickInstallerPackage.ps1 -ReleaseDirectory (Join-Path $extracted 'UrbanPlanToolbox-v1.8.1-x64-one-click') -ZipPath $zip
          Copy-Item -LiteralPath $env:BUNDLE_PATH -Destination (Join-Path $assets $env:BUNDLE_FILE_NAME) -Force

      - name: Prepare and validate SHA256 manifest
        shell: pwsh
        run: |
          $assets = Join-Path $env:RUNNER_TEMP 'UrbanPlanToolbox-AcceptanceAssets'
          $releaseFiles = @(
            (Join-Path $assets 'UrbanPlanToolbox-v1.8.1-x64-one-click.zip'),
            (Join-Path $assets 'UrbanPlanToolbox_1.8.1.0_x64.msixbundle')
          )
          $manifest = foreach ($file in $releaseFiles) {
            $item = Get-Item -LiteralPath $file
            "{0}  {1}" -f (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant(), $item.Name
          }
          Set-Content -LiteralPath (Join-Path $assets 'SHA256SUMS.txt') -Value $manifest -Encoding ascii
          foreach ($line in (Get-Content (Join-Path $assets 'SHA256SUMS.txt'))) {
            if ($line -notmatch '^[a-f0-9]{64}  .+$') { throw "Invalid SHA256 manifest line: $line" }
          }

      - name: Upload v1.8.1 acceptance artifact
        uses: actions/upload-artifact@v7
        with:
          name: UrbanPlanToolbox-v1.8.1-acceptance
          path: |
            ${{ runner.temp }}/UrbanPlanToolbox-AcceptanceAssets/UrbanPlanToolbox-v1.8.1-x64-one-click.zip
            ${{ runner.temp }}/UrbanPlanToolbox-AcceptanceAssets/UrbanPlanToolbox_1.8.1.0_x64.msixbundle
            ${{ runner.temp }}/UrbanPlanToolbox-AcceptanceAssets/SHA256SUMS.txt
          if-no-files-found: error
