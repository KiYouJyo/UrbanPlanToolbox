name: v1.9.0 Workspace UX Round 2

on:
  push:
    branches:
      - codex/v1.9.0-project-workspace

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: codex/v1.9.0-project-workspace
          fetch-depth: 0

      - name: Apply interaction and editing fixes
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          cs_path = Path('Views/ProjectWorkspacePage.xaml.cs')
          xaml_path = Path('Views/ProjectWorkspacePage.xaml')
          cs = cs_path.read_text(encoding='utf-8-sig')
          xaml = xaml_path.read_text(encoding='utf-8-sig')

          def replace_between(text, start, end, replacement):
              a = text.index(start)
              b = text.index(end, a)
              return text[:a] + replacement.rstrip() + '\n\n' + text[b:]

          cs = cs.replace('using System.Globalization;\nusing System.Text.Json;', 'using System.Globalization;\nusing System.IO;\nusing System.Text.Json;\nusing Microsoft.UI.Dispatching;')
          cs = cs.replace('using Microsoft.UI.Xaml.Media;\nusing Microsoft.UI.Xaml.Navigation;', 'using Microsoft.UI.Xaml.Media;\nusing Microsoft.UI.Xaml.Media.Imaging;\nusing Microsoft.UI.Xaml.Navigation;')
          cs = cs.replace('using Windows.Foundation;\n', 'using Windows.Foundation;\nusing Windows.Storage.Pickers;\n')

          old_field = '    private PointerOperation _pointerOperation;\n'
          new_field = '''    private PointerOperation _pointerOperation;\n\n    private DispatcherQueueTimer? _holdTimer;\n    private FrameworkElement? _holdHandle;\n    private Guid? _holdPanelId;\n    private uint _holdPointerId;\n    private Point _holdStart;\n    private double _holdStartLeft;\n    private double _holdStartTop;\n    private double _holdStartWidth;\n    private double _holdStartHeight;\n'''
          if old_field in cs and 'private DispatcherQueueTimer? _holdTimer;' not in cs:
              cs = cs.replace(old_field, new_field)

          cs = cs.replace(
              'WorkspaceSubtitleText.Text = W("拖动与缩放面板，按项目需要组织自己的工作空间", "Arrange panels around the needs of this project", "プロジェクトに合わせてパネルを自由に配置できます");',
              'WorkspaceSubtitleText.Text = W("长按面板标题拖动；选中后拖拽右下角调整尺寸，右键编辑内容", "Press and hold a panel title to move it; resize from the lower-right handle and right-click to edit", "パネル見出しを長押しして移動し、右下ハンドルでサイズ変更、右クリックで内容を編集できます");')
          cs = cs.replace(
              'WorkspaceSubtitleText.Text = W("研究框架、图表、数据与文献都可以自由组合", "Combine framework, results, data and references freely", "研究フレーム、図表、データ、文献を自由に組み合わせられます");',
              'WorkspaceSubtitleText.Text = W("长按面板标题拖动；右键编辑研究内容，选中后可拉伸尺寸", "Press and hold a panel title to move it; right-click to edit research content and resize when selected", "パネル見出しを長押しして移動し、右クリックで研究内容を編集、選択後にサイズ変更できます");')

          cs = cs.replace('TileCanvas.Height = Math.Max(540, maxBottom + 24);\n        WorkspaceSurface.MinHeight = TileCanvas.Height;', 'TileCanvas.Height = Math.Max(0, maxBottom);\n        WorkspaceSurface.MinHeight = TileCanvas.Height;')

          new_create_tile = r'''    private Border CreateTile(ProjectWorkspacePanel panel, double width, double height)
    {
        var selected = _selectedPanelId == panel.Id;
        var border = new Border
        {
            Width = Math.Max(86, width), Height = Math.Max(82, height),
            CornerRadius = new CornerRadius(8), Padding = new Thickness(12),
            Background = ResourceBrush("CardBackgroundFillColorSecondaryBrush"),
            BorderBrush = selected ? ResourceBrush("AccentFillColorDefaultBrush") : ResourceBrush("CardStrokeColorDefaultBrush"),
            BorderThickness = new Thickness(selected ? 2 : 1), Tag = panel.Id
        };
        border.Tapped += OnTileTapped;
        border.ContextFlyout = CreatePanelMenu(panel);

        var root = new Grid { RowSpacing = 8 };
        root.RowDefinitions.Add(new RowDefinition { Height = GridLength.Auto });
        root.RowDefinitions.Add(new RowDefinition { Height = new GridLength(1, GridUnitType.Star) });

        var header = new Grid
        {
            ColumnSpacing = 8,
            Tag = panel.Id,
            Background = new SolidColorBrush(Microsoft.UI.Colors.Transparent)
        };
        header.ColumnDefinitions.Add(new ColumnDefinition { Width = new GridLength(1, GridUnitType.Star) });
        header.ColumnDefinitions.Add(new ColumnDefinition { Width = GridLength.Auto });
        header.PointerPressed += OnTileHeaderPointerPressed;
        header.PointerMoved += OnTileHeaderPointerMoved;
        header.PointerReleased += OnTileHeaderPointerReleased;
        header.PointerCanceled += OnTileHeaderPointerCanceled;
        ToolTipService.SetToolTip(header, W("长按拖动面板；右键编辑", "Press and hold to move; right-click to edit", "長押しで移動、右クリックで編集"));

        var title = new TextBlock
        {
            Text = string.IsNullOrWhiteSpace(panel.Title) ? PanelName(panel.Kind) : panel.Title,
            Style = (Style)Application.Current.Resources["BodyStrongTextBlockStyle"],
            TextTrimming = TextTrimming.CharacterEllipsis, VerticalAlignment = VerticalAlignment.Center
        };
        header.Children.Add(title);

        if (_layoutEditing)
        {
            var size = new TextBlock
            {
                Text = $"{panel.Width}×{panel.Height}", FontSize = 11, Opacity = .55,
                VerticalAlignment = VerticalAlignment.Center
            };
            Grid.SetColumn(size, 1);
            header.Children.Add(size);
        }
        root.Children.Add(header);

        var body = BuildPanelBody(panel);
        if (body is FrameworkElement bodyElement)
            Grid.SetRow(bodyElement, 1);
        root.Children.Add(body);

        if (_layoutEditing && selected && _project is { IsArchived: false } && _columnCount == 12)
        {
            var resize = new Border
            {
                Width = 18, Height = 18, Tag = panel.Id,
                HorizontalAlignment = HorizontalAlignment.Right,
                VerticalAlignment = VerticalAlignment.Bottom,
                Background = ResourceBrush("AccentFillColorSecondaryBrush"),
                BorderBrush = ResourceBrush("AccentFillColorDefaultBrush"),
                BorderThickness = new Thickness(1),
                CornerRadius = new CornerRadius(4)
            };
            resize.PointerPressed += OnResizeHandlePointerPressed;
            resize.PointerMoved += OnPanelHandlePointerMoved;
            resize.PointerReleased += OnPanelHandlePointerReleased;
            resize.PointerCanceled += OnPanelHandlePointerCanceled;
            Grid.SetRow(resize, 1);
            root.Children.Add(resize);
            ToolTipService.SetToolTip(resize, W("拖动调整尺寸", "Drag to resize", "ドラッグしてサイズ変更"));
        }

        border.Child = root;
        return border;
    }'''
          cs = replace_between(cs, '    private Border CreateTile(ProjectWorkspacePanel panel, double width, double height)', '    private FlyoutBase CreatePanelMenu(ProjectWorkspacePanel panel)', new_create_tile)

          new_menu = r'''    private FlyoutBase CreatePanelMenu(ProjectWorkspacePanel panel)
    {
        var menu = new MenuFlyout();
        var edit = new MenuFlyoutItem
        {
            Text = W("编辑内容", "Edit content", "内容を編集"),
            Tag = panel.Id,
            IsEnabled = _project is { IsArchived: false }
        };
        edit.Click += OnEditPanelContent;
        menu.Items.Add(edit);

        var settings = new MenuFlyoutItem
        {
            Text = W("面板设置", "Panel settings", "パネル設定"),
            Tag = panel.Id,
            IsEnabled = _project is { IsArchived: false }
        };
        settings.Click += OnPanelSettings;
        menu.Items.Add(settings);

        if (_project is { IsArchived: false })
        {
            var duplicate = new MenuFlyoutItem { Text = W("复制面板", "Duplicate panel", "パネルを複製"), Tag = panel.Id };
            duplicate.Click += OnDuplicatePanel;
            menu.Items.Add(duplicate);
            menu.Items.Add(new MenuFlyoutSeparator());
            var delete = new MenuFlyoutItem { Text = W("删除面板", "Remove panel", "パネルを削除"), Tag = panel.Id };
            delete.Click += OnRemovePanel;
            menu.Items.Add(delete);
        }
        return menu;
    }'''
          cs = replace_between(cs, '    private FlyoutBase CreatePanelMenu(ProjectWorkspacePanel panel)', '    private UIElement BuildPanelBody(ProjectWorkspacePanel panel)', new_menu)

          new_switch = r'''    private UIElement BuildPanelBody(ProjectWorkspacePanel panel) => panel.Kind switch
    {
        ProjectWorkspacePanelKinds.ImageShowcase => BuildImageShowcase(panel),
        ProjectWorkspacePanelKinds.Milestones or ProjectWorkspacePanelKinds.ResearchProgress => BuildMilestones(panel),
        ProjectWorkspacePanelKinds.Description => BuildDescription(),
        ProjectWorkspacePanelKinds.Inspirations => BuildInspirations(panel),
        ProjectWorkspacePanelKinds.Files or ProjectWorkspacePanelKinds.DataAndScripts => BuildFiles(panel),
        ProjectWorkspacePanelKinds.KeyStrategies => BuildStrategies(panel),
        ProjectWorkspacePanelKinds.ResearchFramework => BuildResearchFramework(panel),
        ProjectWorkspacePanelKinds.ResearchQuestion => BuildResearchQuestion(),
        ProjectWorkspacePanelKinds.Chart => BuildChart(panel),
        ProjectWorkspacePanelKinds.Literature => BuildLiterature(panel),
        ProjectWorkspacePanelKinds.TextNote => BuildTextNote(panel),
        _ => BuildCustom(panel)
    };'''
          cs = replace_between(cs, '    private UIElement BuildPanelBody(ProjectWorkspacePanel panel)', '    private UIElement BuildImageShowcase(ProjectWorkspacePanel panel)', new_switch)

          new_image_showcase = r'''    private UIElement BuildImageShowcase(ProjectWorkspacePanel panel)
    {
        var items = GetShowcaseItems(panel);
        if (items.Count == 0)
        {
            return new Grid
            {
                Children =
                {
                    new StackPanel
                    {
                        Spacing = 8,
                        HorizontalAlignment = HorizontalAlignment.Center,
                        VerticalAlignment = VerticalAlignment.Center,
                        Children =
                        {
                            new FontIcon { Glyph = "\uEB9F", FontSize = 26, Opacity = .5 },
                            new TextBlock
                            {
                                Text = W("右键此面板添加展示图片", "Right-click this panel to add showcase images", "このパネルを右クリックして画像を追加"),
                                TextAlignment = TextAlignment.Center,
                                TextWrapping = TextWrapping.Wrap,
                                Opacity = .62
                            }
                        }
                    }
                }
            };
        }

        var host = new Grid();
        var scroll = new ScrollViewer
        {
            HorizontalScrollMode = ScrollMode.Enabled,
            HorizontalScrollBarVisibility = ScrollBarVisibility.Hidden,
            VerticalScrollMode = ScrollMode.Disabled,
            VerticalScrollBarVisibility = ScrollBarVisibility.Disabled,
            ZoomMode = ZoomMode.Disabled
        };
        var strip = new StackPanel { Orientation = Orientation.Horizontal, Spacing = 12 };
        var cardWidth = Math.Clamp(panel.Width * Math.Max(80, _unitWidth) * .78, 220, 520);
        var cardHeight = Math.Clamp(panel.Height * TileRowHeight - 64, 120, 320);

        foreach (var item in items)
        {
            var visual = new Grid();
            var bitmap = CreateBitmapImage(item.Source);
            if (bitmap is not null)
            {
                visual.Children.Add(new Image { Source = bitmap, Stretch = Stretch.UniformToFill });
            }
            else
            {
                visual.Children.Add(new Border
                {
                    Background = ResourceBrush("CardBackgroundFillColorDefaultBrush"),
                    Child = new FontIcon
                    {
                        Glyph = "\uEB9F",
                        FontSize = 30,
                        Opacity = .4,
                        HorizontalAlignment = HorizontalAlignment.Center,
                        VerticalAlignment = VerticalAlignment.Center
                    }
                });
            }

            var caption = new Border
            {
                VerticalAlignment = VerticalAlignment.Bottom,
                Background = new SolidColorBrush(Windows.UI.Color.FromArgb(190, 20, 20, 20)),
                Padding = new Thickness(12, 8, 12, 8),
                Child = new TextBlock
                {
                    Text = item.Title,
                    Foreground = new SolidColorBrush(Microsoft.UI.Colors.White),
                    TextTrimming = TextTrimming.CharacterEllipsis
                }
            };
            visual.Children.Add(caption);
            strip.Children.Add(new Border
            {
                Width = cardWidth,
                Height = cardHeight,
                CornerRadius = new CornerRadius(8),
                BorderBrush = ResourceBrush("CardStrokeColorDefaultBrush"),
                BorderThickness = new Thickness(1),
                Child = visual
            });
        }

        scroll.Content = strip;
        host.Children.Add(scroll);
        if (items.Count > 1)
        {
            var previous = new Button
            {
                Content = "‹", Width = 38, Height = 38, MinWidth = 38,
                HorizontalAlignment = HorizontalAlignment.Left,
                VerticalAlignment = VerticalAlignment.Center,
                Margin = new Thickness(6, 0, 0, 0),
                Opacity = .9
            };
            previous.Click += (_, _) => scroll.ChangeView(Math.Max(0, scroll.HorizontalOffset - Math.Max(220, scroll.ViewportWidth * .82)), null, null, true);
            host.Children.Add(previous);

            var next = new Button
            {
                Content = "›", Width = 38, Height = 38, MinWidth = 38,
                HorizontalAlignment = HorizontalAlignment.Right,
                VerticalAlignment = VerticalAlignment.Center,
                Margin = new Thickness(0, 0, 6, 0),
                Opacity = .9
            };
            next.Click += (_, _) => scroll.ChangeView(scroll.HorizontalOffset + Math.Max(220, scroll.ViewportWidth * .82), null, null, true);
            host.Children.Add(next);
        }
        return host;
    }'''
          cs = replace_between(cs, '    private UIElement BuildImageShowcase(ProjectWorkspacePanel panel)', '    private UIElement BuildMilestones(ProjectWorkspacePanel panel)', new_image_showcase)

          new_inspirations = r'''    private UIElement BuildInspirations(ProjectWorkspacePanel panel)
    {
        var stack = new StackPanel { Spacing = 8 };
        var count = panel.Height <= 1 ? 2 : 5;
        foreach (var item in _linkedInspirations.Take(count))
        {
            var row = new StackPanel { Orientation = Orientation.Horizontal, Spacing = 8 };
            row.Children.Add(new FontIcon { Glyph = "\uE8F1", FontSize = 12, Opacity = .5, VerticalAlignment = VerticalAlignment.Center });
            row.Children.Add(new TextBlock { Text = item.Title, TextTrimming = TextTrimming.CharacterEllipsis, VerticalAlignment = VerticalAlignment.Center });
            stack.Children.Add(row);
        }
        if (_linkedInspirations.Count == 0)
            stack.Children.Add(new TextBlock { Text = W("暂无关联灵感", "No linked inspirations", "関連付けられたアイデアはありません"), Opacity = .62 });
        return stack;
    }'''
          cs = replace_between(cs, '    private UIElement BuildInspirations(ProjectWorkspacePanel panel)', '    private UIElement BuildFiles(ProjectWorkspacePanel panel)', new_inspirations)

          new_files = r'''    private UIElement BuildFiles(ProjectWorkspacePanel panel)
    {
        var stack = new StackPanel { Spacing = 8 };
        if (panel.Kind == ProjectWorkspacePanelKinds.DataAndScripts)
        {
            var entries = GetSettingLines(panel, "content");
            if (entries.Count == 0)
            {
                stack.Children.Add(new TextBlock
                {
                    Text = W("右键添加数据集、脚本或分析资源。", "Right-click to add datasets, scripts or analysis resources.", "右クリックしてデータセット、スクリプト、分析資料を追加できます。"),
                    Opacity = .62,
                    TextWrapping = TextWrapping.Wrap
                });
                return stack;
            }
            foreach (var line in entries.Take(panel.Height <= 1 ? 2 : 6))
            {
                var parts = line.Split('|', 2, StringSplitOptions.TrimEntries);
                stack.Children.Add(FileRow("\uE943", parts[0], parts.Length > 1 ? parts[1] : string.Empty));
            }
            return stack;
        }

        if (_project?.WorkFolder is { } folder)
            stack.Children.Add(FileRow("\uE8B7", folder.DisplayName, folder.DisplayPath));
        else
            stack.Children.Add(FileRow("\uE8B7", W("工作文件夹", "Work folder", "作業フォルダー"), W("尚未设置", "Not configured", "未設定")));

        stack.Children.Add(FileRow("\uE7C3", W("项目归档", "Project archive", "プロジェクトアーカイブ"), _project?.IsArchived == true ? W("已归档", "Archived", "アーカイブ済み") : W("本地项目", "Local project", "ローカルプロジェクト")));
        if (panel.Height > 1)
            stack.Children.Add(FileRow("\uE753", W("云存档", "Cloud archive", "クラウド保存"), W("由数据管理统一同步", "Managed by Data Management", "データ管理から同期")));
        return stack;
    }'''
          cs = replace_between(cs, '    private UIElement BuildFiles(ProjectWorkspacePanel panel)', '    private static UIElement FileRow', new_files)

          new_strategies = r'''    private UIElement BuildStrategies(ProjectWorkspacePanel panel)
    {
        var stack = new StackPanel { Spacing = 7 };
        var source = _project?.PlanningRequirements;
        var items = string.IsNullOrWhiteSpace(source)
            ? Array.Empty<string>()
            : source.Split(['\r', '\n', '；', ';'], StringSplitOptions.RemoveEmptyEntries | StringSplitOptions.TrimEntries).Take(panel.Height <= 1 ? 3 : 6).ToArray();
        if (items.Length == 0)
        {
            stack.Children.Add(new TextBlock { Text = W("右键添加重点策略。", "Right-click to add key strategies.", "右クリックして重点戦略を追加できます。"), Opacity = .62 });
            return stack;
        }
        foreach (var item in items)
        {
            var row = new StackPanel { Orientation = Orientation.Horizontal, Spacing = 8 };
            row.Children.Add(new TextBlock { Text = "•", Opacity = .55 });
            row.Children.Add(new TextBlock { Text = item, TextTrimming = TextTrimming.CharacterEllipsis, TextWrapping = TextWrapping.Wrap });
            stack.Children.Add(row);
        }
        return stack;
    }'''
          cs = replace_between(cs, '    private UIElement BuildStrategies(ProjectWorkspacePanel panel)', '    private UIElement BuildResearchFramework(ProjectWorkspacePanel panel)', new_strategies)

          new_framework = r'''    private UIElement BuildResearchFramework(ProjectWorkspacePanel panel)
    {
        var details = _project?.ResearchDetails;
        var output = panel.Settings.TryGetValue("output", out var configuredOutput) && !string.IsNullOrWhiteSpace(configuredOutput)
            ? configuredOutput
            : W("图表 · 结论 · 建议", "Figures · findings · guidance", "図表・結論・提案");
        var grid = new Grid { ColumnSpacing = 8 };
        for (var i = 0; i < 4; i++) grid.ColumnDefinitions.Add(new ColumnDefinition());
        var phases = new[]
        {
            (W("1 研究问题", "1 Question", "1 研究課題"), TrimForMetric(details?.ResearchSubject)),
            (W("2 数据与对象", "2 Data & subject", "2 データ・対象"), TrimForMetric(details?.ResearchField)),
            (W("3 分析方法", "3 Methods", "3 分析方法"), TrimForMetric(details?.ResearchMethods)),
            (W("4 预期产出", "4 Output", "4 成果"), TrimForMetric(output))
        };
        for (var i = 0; i < phases.Length; i++)
        {
            var stack = new StackPanel { Spacing = 8 };
            stack.Children.Add(new TextBlock { Text = phases[i].Item1, FontWeight = Microsoft.UI.Text.FontWeights.SemiBold });
            stack.Children.Add(new TextBlock { Text = phases[i].Item2, TextWrapping = TextWrapping.Wrap, MaxLines = 4, TextTrimming = TextTrimming.CharacterEllipsis, Opacity = .65 });
            var card = new Border { Background = ResourceBrush("CardBackgroundFillColorDefaultBrush"), CornerRadius = new CornerRadius(6), Padding = new Thickness(10), Child = stack };
            Grid.SetColumn(card, i); grid.Children.Add(card);
        }
        return grid;
    }'''
          cs = replace_between(cs, '    private UIElement BuildResearchFramework(ProjectWorkspacePanel panel)', '    private UIElement BuildResearchQuestion()', new_framework)

          new_chart = r'''    private UIElement BuildChart(ProjectWorkspacePanel panel)
    {
        var data = new List<(string Label, double Value)>();
        foreach (var line in GetSettingLines(panel, "data"))
        {
            var parts = line.Split(',', 2, StringSplitOptions.TrimEntries);
            if (parts.Length == 2 && double.TryParse(parts[1], NumberStyles.Float, CultureInfo.InvariantCulture, out var value))
                data.Add((parts[0], value));
        }
        if (data.Count == 0)
            return new TextBlock { Text = W("右键添加图表数据。格式：指标,数值", "Right-click to add chart data. Format: label,value", "右クリックしてチャートデータを追加。形式：項目,値"), Opacity = .62, TextWrapping = TextWrapping.Wrap };

        var max = Math.Max(1, data.Max(item => Math.Abs(item.Value)));
        var grid = new Grid { ColumnSpacing = 8, VerticalAlignment = VerticalAlignment.Stretch };
        foreach (var _ in data) grid.ColumnDefinitions.Add(new ColumnDefinition());
        for (var i = 0; i < data.Count; i++)
        {
            var column = new Grid { RowSpacing = 5 };
            column.RowDefinitions.Add(new RowDefinition { Height = new GridLength(1, GridUnitType.Star) });
            column.RowDefinitions.Add(new RowDefinition { Height = GridLength.Auto });
            var bar = new Border
            {
                Height = 24 + 90 * Math.Abs(data[i].Value) / max,
                Background = ResourceBrush("AccentFillColorSecondaryBrush"),
                CornerRadius = new CornerRadius(3),
                VerticalAlignment = VerticalAlignment.Bottom,
                Margin = new Thickness(4, 0, 4, 0)
            };
            column.Children.Add(bar);
            var label = new TextBlock { Text = data[i].Label, FontSize = 10, Opacity = .6, TextTrimming = TextTrimming.CharacterEllipsis, TextAlignment = TextAlignment.Center };
            Grid.SetRow(label, 1); column.Children.Add(label);
            Grid.SetColumn(column, i); grid.Children.Add(column);
        }
        return grid;
    }'''
          cs = replace_between(cs, '    private UIElement BuildChart()', '    private UIElement BuildLiterature()', new_chart)

