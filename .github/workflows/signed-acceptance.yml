name: Signed Acceptance

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Validate, build, sign, and package x64
    runs-on: windows-2025-vs2026
    timeout-minutes: 45

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Resolve and verify release metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Get-Content -Raw release/release.json | ConvertFrom-Json
          $version = [string]$release.product.version
          $packageVersion = [string]$release.product.packageVersion
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Unsupported release version: $version" }
          if ($packageVersion -ne "$version.0") { throw "Package version mismatch in release metadata: $packageVersion" }

          [xml]$project = Get-Content -Raw UrbanPlanToolbox.csproj
          $projectVersion = @($project.Project.PropertyGroup | ForEach-Object Version | Where-Object { $_ })[0]
          $appVersion = (Get-Content Services/AppVersionProvider.cs -Raw | Select-String 'Version = "([^"]+)"' -AllMatches).Matches[0].Groups[1].Value
          [xml]$manifest = Get-Content -Raw Package.appxmanifest
          [xml]$storeManifest = Get-Content -Raw Package.Store.appxmanifest

          if ($projectVersion -ne $version) { throw "Project version mismatch: expected $version, got $projectVersion" }
          if ($appVersion -ne $version) { throw "App version mismatch: expected $version, got $appVersion" }
          if ($manifest.Package.Identity.Version -ne $packageVersion) { throw "Sideload manifest mismatch: $($manifest.Package.Identity.Version)" }
          if ($storeManifest.Package.Identity.Version -ne $packageVersion) { throw "Store manifest mismatch: $($storeManifest.Package.Identity.Version)" }
          if ($release.channels.microsoftStore.submit -and -not (Test-Path "packaging/store-release-notes/$version.json")) {
            throw "Store submission is enabled but packaging/store-release-notes/$version.json is missing."
          }

          "RELEASE_VERSION=$version" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PACKAGE_VERSION=$packageVersion" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Acceptance candidate: v$version ($packageVersion)"

      - name: Validate release documentation
        shell: pwsh
        run: ./scripts/Test-ReleaseDocumentationConsistency.ps1

      - name: Validate documentation SSOT
        shell: pwsh
        run: ./packaging/Test-DocumentationConsistency.ps1

      - name: Restore Release x64 dependencies
        shell: pwsh
        run: dotnet restore UrbanPlanToolbox.slnx -p:Configuration=Release -p:Platform=x64

      - name: Run full unit test suite
        shell: pwsh
        run: dotnet test UrbanPlanToolbox.slnx -c Release -p:Platform=x64 --no-restore --verbosity normal

      - name: Build Debug x64
        shell: pwsh
        run: dotnet build UrbanPlanToolbox.slnx -c Debug -p:Platform=x64

      - name: Build Release x64
        shell: pwsh
        run: dotnet build UrbanPlanToolbox.slnx -c Release -p:Platform=x64 --no-restore

      - name: Validate signing configuration
        shell: pwsh
        env:
          RELEASE_CERTIFICATE_BASE64: ${{ secrets.GH_RELEASE_CERTIFICATE_BASE64 }}
          RELEASE_CERTIFICATE_PASSWORD: ${{ secrets.GH_RELEASE_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_CERTIFICATE_BASE64) -or [string]::IsNullOrWhiteSpace($env:RELEASE_CERTIFICATE_PASSWORD)) {
            throw 'GitHub release signing secrets are not configured.'
          }

      - name: Build unsigned x64 MSIX bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'UrbanPlanToolbox-Acceptance-AppPackages'
          dotnet build UrbanPlanToolbox.csproj -c Release -p:Platform=x64 -p:GenerateAppxPackageOnBuild=true -p:AppxPackageSigningEnabled=false -p:AppxBundle=Always -p:AppxBundlePlatforms=x64 -p:UapAppxPackageBuildMode=SideloadOnly -p:AppxPackageDir="$output\"
          if ($LASTEXITCODE -ne 0) { throw "MSIX build failed: $LASTEXITCODE" }
          $bundle = @(Get-ChildItem $output -Recurse -Filter '*.msixbundle') | Select-Object -First 1
          if (-not $bundle) { throw 'MSIX bundle was not produced.' }
          $expectedName = "UrbanPlanToolbox_$($env:PACKAGE_VERSION)_x64.msixbundle"
          if ($bundle.Name -ne $expectedName) { throw "Unexpected bundle name: $($bundle.Name); expected $expectedName" }
          "BUNDLE_PATH=$($bundle.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "BUNDLE_FILE_NAME=$($bundle.Name)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Sign and verify acceptance bundle
        shell: pwsh
        env:
          RELEASE_CERTIFICATE_BASE64: ${{ secrets.GH_RELEASE_CERTIFICATE_BASE64 }}
          RELEASE_CERTIFICATE_PASSWORD: ${{ secrets.GH_RELEASE_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = Join-Path $env:RUNNER_TEMP "UrbanPlanToolbox-v$($env:RELEASE_VERSION)-signed-acceptance"
          New-Item -ItemType Directory -Force -Path $assets | Out-Null
          $pfx = Join-Path $assets 'release-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:RELEASE_CERTIFICATE_BASE64))
          $securePassword = ConvertTo-SecureString $env:RELEASE_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword
          if ($certificate.Subject -cne 'CN=AppPublisher' -or $certificate.Thumbprint -cne 'BD85AD77A651C86CA01A480C8E9BC64952993F98' -or -not $certificate.HasPrivateKey) {
            throw "Unexpected signing certificate: Subject=$($certificate.Subject); Thumbprint=$($certificate.Thumbprint); HasPrivateKey=$($certificate.HasPrivateKey)"
          }
          $cer = Join-Path $assets "UrbanPlanToolbox-v$($env:RELEASE_VERSION)-acceptance.cer"
          Export-Certificate -Cert $certificate -FilePath $cer | Out-Null
          $kitsRoot = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          $signtool = Get-ChildItem (Join-Path $kitsRoot 'Windows Kits\10\bin') -Recurse -Filter signtool.exe | Where-Object FullName -match '\\x64\\signtool.exe$' | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'x64 signtool.exe was not found.' }
          & $signtool.FullName sign /fd SHA256 /sha1 $certificate.Thumbprint /tr http://timestamp.digicert.com /td SHA256 $env:BUNDLE_PATH
          if ($LASTEXITCODE -ne 0) { throw "signtool sign failed: $LASTEXITCODE" }
          $signature = Get-AuthenticodeSignature -FilePath $env:BUNDLE_PATH
          if (-not $signature.SignerCertificate) { throw "Signed bundle has no signer certificate. Status=$($signature.Status)" }
          if ($signature.SignerCertificate.Subject -cne 'CN=AppPublisher' -or $signature.SignerCertificate.Thumbprint -cne $certificate.Thumbprint) { throw 'Signed bundle signer mismatch.' }
          if ($signature.Status -eq 'UnknownError') {
            if ($signature.StatusMessage -notmatch '(?i)not trusted|trust provider|untrusted|self-signed') { throw "Unexpected Authenticode status: $($signature.StatusMessage)" }
          }
          elseif ($signature.Status -ne 'Valid') { throw "Signed bundle Authenticode status is not acceptable: $($signature.Status) / $($signature.StatusMessage)" }
          Copy-Item -LiteralPath $env:BUNDLE_PATH -Destination (Join-Path $assets $env:BUNDLE_FILE_NAME) -Force
          Remove-Item -LiteralPath $pfx -Force
          "ACCEPTANCE_ASSETS=$assets" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CERTIFICATE_PATH=$cer" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Authenticode signer verified: $($signature.SignerCertificate.Subject) / $($signature.SignerCertificate.Thumbprint); status=$($signature.Status)"

      - name: Generate and validate one-click acceptance package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $staging = Join-Path $env:ACCEPTANCE_ASSETS 'staging'
          & ./packaging/New-GitHubOneClickInstallerPackage.ps1 -SignedBundlePath $env:BUNDLE_PATH -PublicCertificatePath $env:CERTIFICATE_PATH -OutputDirectory $staging -DisplayVersion $env:RELEASE_VERSION -PackageVersion $env:PACKAGE_VERSION
          $packageRoot = Join-Path $staging "UrbanPlanToolbox-v$($env:RELEASE_VERSION)-x64-one-click"
          & ./packaging/Test-GitHubOneClickInstallerPackage.ps1 -ReleaseDirectory $packageRoot
          $zip = Join-Path $env:ACCEPTANCE_ASSETS "UrbanPlanToolbox-v$($env:RELEASE_VERSION)-x64-signed-acceptance.zip"
          Compress-Archive -LiteralPath $packageRoot -DestinationPath $zip -CompressionLevel Optimal
          $extracted = Join-Path $env:ACCEPTANCE_ASSETS 'verify-extracted'
          Expand-Archive -LiteralPath $zip -DestinationPath $extracted -Force
          & ./packaging/Test-GitHubOneClickInstallerPackage.ps1 -ReleaseDirectory (Join-Path $extracted "UrbanPlanToolbox-v$($env:RELEASE_VERSION)-x64-one-click") -ZipPath $zip
          Remove-Item -LiteralPath $staging,$extracted -Recurse -Force

      - name: Generate SHA-256 manifest
        shell: pwsh
        run: |
          $files = Get-ChildItem $env:ACCEPTANCE_ASSETS -File | Sort-Object Name
          $manifest = foreach ($file in $files) { "{0}  {1}" -f (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $file.Name }
          Set-Content -LiteralPath (Join-Path $env:ACCEPTANCE_ASSETS 'SHA256SUMS.txt') -Value $manifest -Encoding ascii
          Get-Content (Join-Path $env:ACCEPTANCE_ASSETS 'SHA256SUMS.txt')

      - name: Upload signed acceptance artifact
        uses: actions/upload-artifact@v6
        with:
          name: UrbanPlanToolbox-v${{ env.RELEASE_VERSION }}-signed-acceptance
          path: ${{ env.ACCEPTANCE_ASSETS }}
          if-no-files-found: error
          retention-days: 14
