name: Verify Microsoft Store state (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PRODUCT_ID: 9MWDPJG1BHKW
  EXPECTED_LAST_PUBLISHED_SUBMISSION_ID: '1152921505701574155'

jobs:
  verify:
    runs-on: windows-2025-vs2026
    steps:
      - name: Verify pending is null and published ID is unchanged
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        run: |
          $ErrorActionPreference = 'Stop'
          $token = Invoke-RestMethod -Method Post -Uri "https://login.microsoftonline.com/$env:TENANT_ID/oauth2/v2.0/token" -ContentType 'application/x-www-form-urlencoded' -Body @{ client_id = $env:CLIENT_ID; client_secret = $env:CLIENT_SECRET; scope = 'https://manage.devcenter.microsoft.com/.default'; grant_type = 'client_credentials' }
          $headers = @{ Authorization = "Bearer $($token.access_token)"; TenantId = $env:TENANT_ID; Accept = 'application/json' }
          $uri = "https://manage.devcenter.microsoft.com/v1.0/my/applications/$env:PRODUCT_ID"
          $application = (Invoke-WebRequest -Method Get -Uri $uri -Headers $headers).Content | ConvertFrom-Json -AsHashtable -Depth 100
          $pending = $application['PendingApplicationSubmission']
          $published = $application['LastPublishedApplicationSubmission']
          "application_keys=$($application.Keys -join ',')" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY
          $publishedUri = "$uri/submissions/$env:EXPECTED_LAST_PUBLISHED_SUBMISSION_ID"
          $publishedResponse = (Invoke-WebRequest -Method Get -Uri $publishedUri -Headers $headers).Content | ConvertFrom-Json -AsHashtable -Depth 100
          "published_submission_get_id=$([string]$publishedResponse['Id'])" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "published_submission_get_status=$([string]$publishedResponse['Status'])" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($null -ne $pending) { throw "Pending submission still exists: $([string]$pending['Id'])" }
          $publishedId = if ($null -eq $published) { '' } else { [string]$published['Id'] }
          if ([string]::IsNullOrWhiteSpace($publishedId) -or $publishedId -cne $env:EXPECTED_LAST_PUBLISHED_SUBMISSION_ID) { throw "Published submission mismatch. Expected=$env:EXPECTED_LAST_PUBLISHED_SUBMISSION_ID Actual=$publishedId" }
          "pending_submission=none" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY
          "last_published_submission_id=$($published['Id'])" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
