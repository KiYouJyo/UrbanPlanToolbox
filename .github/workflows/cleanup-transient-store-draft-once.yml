name: Cleanup transient Microsoft Store draft (guarded)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PRODUCT_ID: 9MWDPJG1BHKW
  TRANSIENT_SUBMISSION_ID: '1152921505701593493'
  PROTECTED_PUBLISHED_SUBMISSION_ID: '1152921505701574155'

jobs:
  cleanup:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v7

      - name: Remove only the matching pre-commit transient draft
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        run: |
          $ErrorActionPreference = 'Stop'
          & ./packaging/Remove-TransientStoreDraft.ps1 -ProductId $env:PRODUCT_ID -SubmissionId $env:TRANSIENT_SUBMISSION_ID -ExpectedPackageVersion '1.3.1.0' -ExpectedPackageFileName 'UrbanPlanToolbox_1.3.1.0_x64_bundle.msixupload' -ProtectedPublishedSubmissionId $env:PROTECTED_PUBLISHED_SUBMISSION_ID -TenantId $env:TENANT_ID.Trim() -ClientId $env:CLIENT_ID.Trim() -ClientSecret $env:CLIENT_SECRET

      - name: Verify pending draft is gone and published submission is unchanged
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        run: |
          $ErrorActionPreference = 'Stop'
          $token = Invoke-RestMethod -Method Post -Uri "https://login.microsoftonline.com/$env:TENANT_ID/oauth2/v2.0/token" -ContentType 'application/x-www-form-urlencoded' -Body @{ client_id = $env:CLIENT_ID; client_secret = $env:CLIENT_SECRET; scope = 'https://manage.devcenter.microsoft.com/.default'; grant_type = 'client_credentials' }
          $headers = @{ Authorization = "Bearer $($token.access_token)"; TenantId = $env:TENANT_ID; Accept = 'application/json' }
          $uri = "https://manage.devcenter.microsoft.com/v1.0/my/applications/$env:PRODUCT_ID"
          $application = (Invoke-WebRequest -Method Get -Uri $uri -Headers $headers).Content | ConvertFrom-Json -AsHashtable -Depth 100
          if ($null -ne $application.PendingApplicationSubmission) { throw "Pending submission still exists: $($application.PendingApplicationSubmission.Id)" }
          if ([string]$application.LastPublishedApplicationSubmission.Id -cne $env:PROTECTED_PUBLISHED_SUBMISSION_ID) { throw 'Published submission changed.' }
          "pending_submission=none" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY
          "last_published_submission_id=$($application.LastPublishedApplicationSubmission.Id)" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
