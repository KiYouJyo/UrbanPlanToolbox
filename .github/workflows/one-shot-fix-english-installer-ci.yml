name: One-shot fix English installer CI

on:
  push:
    branches:
      - fix/english-one-click-package-names
    paths:
      - .github/workflows/one-shot-fix-english-installer-ci.yml

permissions:
  contents: write

jobs:
  fix-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/english-one-click-package-names

      - name: Update CI paths and normalize CMD line endings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ci = Path('.github/workflows/ci.yml')
          text = ci.read_text(encoding='utf-8')
          replacements = {
              "'packaging/① 安装规划工具箱.cmd'": "'packaging/1-Install-UrbanPlanToolbox.cmd'",
              "'packaging/② 卸载规划工具箱.cmd'": "'packaging/2-Uninstall-UrbanPlanToolbox.cmd'",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected CI path not found: {old}')
              text = text.replace(old, new, 1)
          ci.write_text(text, encoding='utf-8', newline='\n')

          for name in ['packaging/1-Install-UrbanPlanToolbox.cmd', 'packaging/2-Uninstall-UrbanPlanToolbox.cmd']:
              p = Path(name)
              raw = p.read_text(encoding='ascii')
              normalized = raw.replace('\r\n', '\n').replace('\r', '\n')
              p.write_bytes(normalized.replace('\n', '\r\n').encode('ascii'))
          PY

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml packaging/1-Install-UrbanPlanToolbox.cmd packaging/2-Uninstall-UrbanPlanToolbox.cmd
          git commit -m "ci: validate English installer entry files"
          git push origin HEAD:fix/english-one-click-package-names
