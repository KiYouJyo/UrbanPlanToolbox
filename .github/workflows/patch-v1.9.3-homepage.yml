name: Patch v1.9.3 homepage once

on:
  push:
    branches:
      - fix/v1.9.3-homepage-sync
    paths:
      - '.github/workflows/patch-v1.9.3-homepage.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/v1.9.3-homepage-sync
          fetch-depth: 0

      - name: Update website fallback and cache behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import html as html_lib
          import json
          import re

          path = Path('docs/index.html')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new):
              global text
              if old not in text:
                  raise SystemExit(f'Expected homepage fragment not found: {old[:120]!r}')
              text = text.replace(old, new, 1)

          replace_once('id="hero-version">v1.9.2<', 'id="hero-version">v1.9.3<')
          replace_once('id="github-version">1.9.2<', 'id="github-version">1.9.3<')
          replace_once('id="store-candidate">1.9.2.0<', 'id="store-candidate">1.9.3.0<')
          replace_once('id="store-public">1.8.2<', 'id="store-public">1.9.2<')

          replace_once(
              '<p class="l zh">v1.9.2 将三套专业资料库接入独立的 UrbanPlanToolbox_Data 数据仓库。应用可主动检查官方 Catalog、下载新的 .uptdata，也支持本地导入和回退到上一版本。所有数据包在激活前都会进行 ID、Schema、最低应用版本、路径安全、大小与 SHA-256 完整性校验。</p>',
              '<p class="l zh">v1.9.2 建立三套专业资料库与独立 UrbanPlanToolbox_Data / Data Pack 1.0 框架；v1.9.3 将设计理念数据库升级至 2026.08.3，共 109 条，并补齐分类、适用项目类型、标签、案例备注与来源说明的中日英三语。应用继续支持官方 Catalog、.uptdata 下载/导入、完整性校验与回退。</p>'
          )
          replace_once(
              '<p class="l ja">v1.9.2 では3つの専門ライブラリを独立した UrbanPlanToolbox_Data に接続しました。公式 Catalog の確認、.uptdata の取得、ローカル読み込み、前版へのロールバックに対応し、有効化前に ID、Schema、最低アプリ版、パス安全性、サイズ、SHA-256 を検証します。</p>',
              '<p class="l ja">v1.9.2 で3つの専門ライブラリと独立した UrbanPlanToolbox_Data / Data Pack 1.0 基盤を構築し、v1.9.3 ではデザインコンセプトDBを 2026.08.3・109件へ更新しました。カテゴリ、適用プロジェクト種別、タグ、事例メモ、出典説明まで中日英3言語に対応し、Catalog、.uptdata の取得/読み込み、完全性検証、ロールバックも継続して利用できます。</p>'
          )
          replace_once(
              '<p class="l en">v1.9.2 connects all three professional libraries to the independent UrbanPlanToolbox_Data repository. The app can explicitly check the official catalog, download .uptdata packs, import local packs, and roll back to a prior version. Pack ID, schema, minimum app version, path safety, size, and SHA-256 integrity are validated before activation.</p>',
              '<p class="l en">v1.9.2 established the three professional libraries on the independent UrbanPlanToolbox_Data / Data Pack 1.0 foundation; v1.9.3 upgrades the Design Concepts database to 2026.08.3 with 109 entries and completes trilingual categories, applicable project types, tags, case notes, and source notes. Official catalog checks, .uptdata download/import, integrity validation, and rollback remain supported.</p>'
          )
          replace_once('aria-label="Data Pack 2026.08.1 statistics"', 'aria-label="Current professional library statistics"')
          replace_once('<div class="stat"><strong>18</strong><span><span class="l zh">设计理念</span>', '<div class="stat"><strong>109</strong><span><span class="l zh">设计理念</span>')

          replace_once('id="github-version-2">1.9.2<', 'id="github-version-2">1.9.3<')
          replace_once(
              '<p class="l zh">由 Microsoft Store 管理安装与更新。v1.9.2.0 已提交认证；公开可用版本与认证进度以 Store 为准。</p><p class="l ja">インストールと更新を Microsoft Store が管理します。v1.9.2.0 は認証審査に提出済みで、公開状況は Store を基準とします。</p><p class="l en">Installation and updates are managed by Microsoft Store. v1.9.2.0 has been submitted for certification; public availability follows the Store.</p>',
              '<p class="l zh">由 Microsoft Store 管理安装与更新。当前提交版本、认证状态与已确认公开版本会从项目状态事实源加载，并以 Store / Partner Center 为准。</p><p class="l ja">インストールと更新は Microsoft Store が管理します。提出版、認証状態、確認済み公開版はプロジェクト状態の SSOT から読み込み、Store / Partner Center を基準とします。</p><p class="l en">Installation and updates are managed by Microsoft Store. The submitted build, certification state, and verified public version are loaded from the project-status source of truth and follow Store / Partner Center.</p>'
          )
          replace_once('id="store-candidate-2">1.9.2.0<', 'id="store-candidate-2">1.9.3.0<')
          replace_once('id="store-public-2">1.8.2<', 'id="store-public-2">1.9.2<')

          replace_once('id="release-title">UrbanPlanToolbox v1.9.2<', 'id="release-title">UrbanPlanToolbox v1.9.3<')
          replace_once('id="release-subtitle">Professional libraries and Data Pack 1.0<', 'id="release-subtitle">设计理念数据库第三版<')
          replace_once('href="https://github.com/KiYouJyo/UrbanPlanToolbox/releases/tag/v1.9.2">GitHub Release</a>', 'href="https://github.com/KiYouJyo/UrbanPlanToolbox/releases/tag/v1.9.3">GitHub Release</a>')

          notes_doc = json.loads(Path('docs/release-notes/1.9.3.json').read_text(encoding='utf-8'))
          locale_map = [('zh-CN', 'zh'), ('ja-JP', 'ja'), ('en-US', 'en')]
          rendered = []
          for locale, cls in locale_map:
              items = notes_doc['notes'][locale]['items']
              rendered.append('            <ul class="l %s">%s</ul>' % (
                  cls,
                  ''.join(f'<li>{html_lib.escape(item)}</li>' for item in items)
              ))
          replacement = '          <div class="release-body" id="release-notes">\n' + '\n'.join(rendered) + '\n          </div>\n          <details>'
          text, count = re.subn(r'          <div class="release-body" id="release-notes">\n.*?\n          </div>\n          <details>', replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Expected exactly one release-notes fallback block, replaced {count}')

          replace_once(
              '<summary><span class="l zh">最近版本：v1.9.1 与 v1.9.0</span><span class="l ja">最近のリリース：v1.9.1 / v1.9.0</span><span class="l en">Recent releases: v1.9.1 and v1.9.0</span></summary>',
              '<summary><span class="l zh">最近版本：v1.9.2 与 v1.9.1</span><span class="l ja">最近のリリース：v1.9.2 / v1.9.1</span><span class="l en">Recent releases: v1.9.2 and v1.9.1</span></summary>'
          )
          replace_once(
              '<p class="l zh"><strong>v1.9.1</strong>：稳定性与项目工作台维护，修复项目布局反馈循环，并完善重点策略卡片与 Markdown 展示。<br><strong>v1.9.0</strong>：引入设计/研究项目的响应式自由磁贴工作台与 12 列项目级布局。</p>',
              '<p class="l zh"><strong>v1.9.2</strong>：重构三套专业资料库并接入 Data Pack 1.0，支持官方 Catalog、.uptdata 下载/导入、完整性校验与回退。<br><strong>v1.9.1</strong>：稳定性与项目工作台维护，修复项目布局反馈循环，并完善重点策略卡片与 Markdown 展示。</p>'
          )
          replace_once(
              '<p class="l ja"><strong>v1.9.1</strong>：安定性とプロジェクトワークスペース保守、レイアウト更新ループの修正、重点戦略カードと Markdown 表示の改善。<br><strong>v1.9.0</strong>：設計・研究プロジェクトにレスポンシブな自由配置タイルと12列レイアウトを導入。</p>',
              '<p class="l ja"><strong>v1.9.2</strong>：3つの専門ライブラリを刷新して Data Pack 1.0 に接続し、公式 Catalog、.uptdata の取得/読み込み、完全性検証、ロールバックに対応。<br><strong>v1.9.1</strong>：安定性とプロジェクトワークスペース保守、レイアウト更新ループの修正、重点戦略カードと Markdown 表示の改善。</p>'
          )
          replace_once(
              '<p class="l en"><strong>v1.9.1</strong>: stability and project-workspace maintenance, fixing the layout feedback loop and improving key-strategy cards and Markdown rendering.<br><strong>v1.9.0</strong>: introduced responsive customizable tile workspaces and the canonical 12-column project layout.</p>',
              '<p class="l en"><strong>v1.9.2</strong>: rebuilt the three professional libraries on Data Pack 1.0 with official catalog checks, .uptdata download/import, integrity validation, and rollback.<br><strong>v1.9.1</strong>: stability and project-workspace maintenance, fixing the layout feedback loop and improving key-strategy cards and Markdown rendering.</p>'
          )

          replace_once("fetch('project-status.json', { cache: 'no-store' });", "fetch(`project-status.json?ts=${Date.now()}`, { cache: 'no-store' });")
          replace_once("fetch(`release-notes/${githubVersion}.json`, { cache: 'no-store' });", "fetch(`release-notes/${githubVersion}.json?ts=${Date.now()}`, { cache: 'no-store' });")

          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/patch-v1.9.3-homepage.yml').unlink()
          PY

      - name: Commit patched homepage
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html .github/workflows/patch-v1.9.3-homepage.yml
          git commit -m "docs: sync homepage with v1.9.3 publication"
          git push origin HEAD:fix/v1.9.3-homepage-sync
