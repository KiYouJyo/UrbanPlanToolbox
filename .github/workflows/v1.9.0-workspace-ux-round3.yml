name: v1.9.0 Workspace UX Round 3

on:
  push:
    branches:
      - codex/v1.9.0-project-workspace

permissions:
  contents: write

concurrency:
  group: v1.9.0-workspace-ux-round3
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: codex/v1.9.0-project-workspace
          fetch-depth: 0

      - name: Apply round 3 workspace UX changes
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def replace_block(text, start, end, replacement):
              a = text.find(start)
              if a < 0:
                  raise RuntimeError(f'missing start marker: {start}')
              b = text.find(end, a)
              if b < 0:
                  raise RuntimeError(f'missing end marker: {end}')
              return text[:a] + replacement.rstrip() + '\n\n    ' + text[b:]

          # XAML: remove explicit layout-mode button and make blank canvas hittable to finish edit mode.
          p = Path('Views/ProjectWorkspacePage.xaml')
          xaml = p.read_text(encoding='utf-8-sig')
          xaml = xaml.replace('            <Button x:Name="EditLayoutButton" Click="OnToggleLayoutEditing"/>\n', '')
          xaml = xaml.replace(
              '<Canvas x:Name="TileCanvas" MinHeight="0" HorizontalAlignment="Stretch" SizeChanged="OnTileCanvasSizeChanged"/>',
              '<Canvas x:Name="TileCanvas" MinHeight="0" HorizontalAlignment="Stretch" Background="Transparent" Tapped="OnWorkspaceCanvasTapped" SizeChanged="OnTileCanvasSizeChanged"/>')
          p.write_text(xaml, encoding='utf-8')

          # Project model: keep legacy primary WorkFolder and add backward-compatible additional linked folders.
          p = Path('Models/Projects/ProjectModels.cs')
          model = p.read_text(encoding='utf-8-sig')
          marker = '    public ProjectFolderReference? WorkFolder { get; set; }\n'
          if 'AdditionalFolders' not in model:
              model = model.replace(marker, marker + '    /// <summary>Additional project folders linked from the Files workspace panel. WorkFolder remains the legacy primary folder.</summary>\n    public List<ProjectFolderReference> AdditionalFolders { get; init; } = [];\n')
          p.write_text(model, encoding='utf-8')

          # Project deletion must release every FutureAccessList token, not only the legacy primary folder.
          p = Path('Services/ProjectStorageService.cs')
          storage = p.read_text(encoding='utf-8-sig')
          old = '                folderAccess?.Clear(read.Value!.WorkFolder);\n'
          new = '                folderAccess?.Clear(read.Value!.WorkFolder);\n                foreach (var folder in read.Value.AdditionalFolders)\n                    folderAccess?.Clear(folder);\n'
          if new not in storage:
              if old not in storage:
                  raise RuntimeError('Project deletion folder cleanup marker missing')
              storage = storage.replace(old, new, 1)
          p.write_text(storage, encoding='utf-8')

          p = Path('Views/ProjectWorkspacePage.xaml.cs')
          s = p.read_text(encoding='utf-8-sig')

          s = s.replace('        EditLayoutButton.Content = W("编辑布局", "Edit layout", "レイアウトを編集");\n', '')
          s = s.replace(
              'WorkspaceSubtitleText.Text = W("长按面板标题拖动；选中后拖拽右下角调整尺寸，右键编辑内容", "Press and hold a panel title to move it; resize from the lower-right handle and right-click to edit", "パネル見出しを長押しして移動し、右下ハンドルでサイズ変更、右クリックで内容を編集できます");',
              'WorkspaceSubtitleText.Text = W("长按任意面板进入调整状态；拖动移动，右下角拉伸尺寸，点击空白处完成，右键编辑内容", "Press and hold any panel to enter edit mode; drag to move, resize from the lower-right corner, click empty space to finish, and right-click to edit", "任意のパネルを長押しして編集状態に入り、ドラッグで移動、右下でサイズ変更、空白をクリックして完了、右クリックで内容を編集できます");')
          s = s.replace(
              'WorkspaceSubtitleText.Text = W("长按面板标题拖动；右键编辑研究内容，选中后可拉伸尺寸", "Press and hold a panel title to move it; right-click to edit research content and resize when selected", "パネル見出しを長押しして移動し、右クリックで研究内容を編集、選択後にサイズ変更できます");',
              'WorkspaceSubtitleText.Text = W("长按任意面板进入调整状态；拖动移动，右下角拉伸尺寸，点击空白处完成，右键编辑研究内容", "Press and hold any panel to enter edit mode; drag to move, resize from the lower-right corner, click empty space to finish, and right-click to edit research content", "任意のパネルを長押しして編集状態に入り、ドラッグで移動、右下でサイズ変更、空白をクリックして完了、右クリックで研究内容を編集できます");')
          s = s.replace(
              'WorkspaceSubtitleText.Text = W("长按面板标题拖动；选中后拖拽右下角调整尺寸，右键编辑内容", "Press and hold a panel title to move it; resize from the lower-right handle and right-click to edit", "パネル見出しを長押しして移動し、右下ハンドルでサイズ変更、右クリックで内容を編集できます");',
              'WorkspaceSubtitleText.Text = W("长按任意面板进入调整状态；拖动移动，右下角拉伸尺寸，点击空白处完成，右键编辑内容", "Press and hold any panel to enter edit mode; drag to move, resize from the lower-right corner, click empty space to finish, and right-click to edit", "任意のパネルを長押しして編集状態に入り、ドラッグで移動、右下でサイズ変更、空白をクリックして完了、右クリックで内容を編集できます");')
          s = s.replace(
              '        var canEditLayout = _columnCount == 12 && _project is { IsArchived: false } && !_busy;\n        EditLayoutButton.IsEnabled = canEditLayout;\n        if (!canEditLayout && _layoutEditing)\n        {\n            _layoutEditing = false;\n            _selectedPanelId = null;\n        }\n        ToolTipService.SetToolTip(EditLayoutButton, canEditLayout\n            ? W("拖动或缩放磁贴", "Drag or resize tiles", "タイルをドラッグ・サイズ変更")\n            : W("展开窗口后可编辑布局；窄窗口只改变显示，不覆盖已保存布局。", "Widen the window to edit. Narrow layouts never overwrite the saved 12-column layout.", "ウィンドウを広げると編集できます。狭い表示は保存済み12列レイアウトを上書きしません。"));',
              '        var canEditLayout = _columnCount == 12 && _project is { IsArchived: false } && !_busy;\n        if (!canEditLayout && _layoutEditing)\n        {\n            _layoutEditing = false;\n            _selectedPanelId = null;\n            ClearPointerOperation();\n        }')
          s = s.replace(
              '        UndoLayoutButton.Visibility = _layoutUndo is null || !_layoutEditing ? Visibility.Collapsed : Visibility.Visible;\n        EditLayoutButton.Content = _layoutEditing\n            ? W("完成布局", "Done", "完了")\n            : W("编辑布局", "Edit layout", "レイアウトを編集");',
              '        UndoLayoutButton.Visibility = _layoutUndo is null || !_layoutEditing ? Visibility.Collapsed : Visibility.Visible;')
          s = s.replace(
              '            OverviewValue4.Text = _project.WorkFolder?.DisplayName ?? W("未设置", "Not set", "未設定");',
              '            var folders = GetLinkedFolders();\n            OverviewValue4.Text = folders.Count switch\n            {\n                0 => W("未设置", "Not set", "未設定"),\n                1 => folders[0].DisplayName,\n                _ => W($"{folders.Count} 个文件夹", $"{folders.Count} folders", $"{folders.Count} 個のフォルダー")\n            };')

          create_tile = r'''    private Border CreateTile(ProjectWorkspacePanel panel, double width, double height)
    {
        var selected = _selectedPanelId == panel.Id;
        var border = new Border
        {
            Width = Math.Max(86, width), Height = Math.Max(82, height),
            CornerRadius = new CornerRadius(8), Padding = new Thickness(12),
            Background = ResourceBrush("CardBackgroundFillColorSecondaryBrush"),
            BorderBrush = selected ? ResourceBrush("AccentFillColorDefaultBrush") : ResourceBrush("CardStrokeColorDefaultBrush"),
            BorderThickness = new Thickness(selected ? 2 : 1), Tag = panel.Id
        };
        border.Tapped += OnTileTapped;
        border.ContextFlyout = CreatePanelMenu(panel);
        border.PointerPressed += OnTilePointerPressed;
        border.PointerMoved += OnTilePointerMoved;
        border.PointerReleased += OnTilePointerReleased;
        border.PointerCanceled += OnTilePointerCanceled;
        ToolTipService.SetToolTip(border, W("长按进入调整状态；右键编辑", "Press and hold to arrange; right-click to edit", "長押しで配置を調整、右クリックで編集"));

        var root = new Grid { RowSpacing = 8 };
        root.RowDefinitions.Add(new RowDefinition { Height = GridLength.Auto });
        root.RowDefinitions.Add(new RowDefinition { Height = new GridLength(1, GridUnitType.Star) });

        var header = new Grid { ColumnSpacing = 8 };
        header.ColumnDefinitions.Add(new ColumnDefinition { Width = new GridLength(1, GridUnitType.Star) });
        header.ColumnDefinitions.Add(new ColumnDefinition { Width = GridLength.Auto });

        var title = new TextBlock
        {
            Text = string.IsNullOrWhiteSpace(panel.Title) ? PanelName(panel.Kind) : panel.Title,
            Style = (Style)Application.Current.Resources["BodyStrongTextBlockStyle"],
            TextTrimming = TextTrimming.CharacterEllipsis,
            VerticalAlignment = VerticalAlignment.Center
        };
        header.Children.Add(title);

        if (_layoutEditing)
        {
            var size = new TextBlock
            {
                Text = $"{panel.Width}×{panel.Height}", FontSize = 11, Opacity = .55,
                VerticalAlignment = VerticalAlignment.Center
            };
            Grid.SetColumn(size, 1);
            header.Children.Add(size);
        }
        root.Children.Add(header);

        var body = BuildPanelBody(panel);
        if (body is FrameworkElement bodyElement)
            Grid.SetRow(bodyElement, 1);
        root.Children.Add(body);

        if (_layoutEditing && selected && _project is { IsArchived: false } && _columnCount == 12)
        {
            var resize = new Border
            {
                Width = 24, Height = 24, Tag = panel.Id,
                HorizontalAlignment = HorizontalAlignment.Right,
                VerticalAlignment = VerticalAlignment.Bottom,
                Margin = new Thickness(0, 0, -4, -4),
                Background = ResourceBrush("AccentFillColorSecondaryBrush"),
                BorderBrush = ResourceBrush("AccentFillColorDefaultBrush"),
                BorderThickness = new Thickness(1),
                CornerRadius = new CornerRadius(12),
                Child = new TextBlock
                {
                    Text = "↘", FontSize = 12,
                    HorizontalAlignment = HorizontalAlignment.Center,
                    VerticalAlignment = VerticalAlignment.Center
                }
            };
            resize.PointerPressed += OnResizeHandlePointerPressed;
            resize.PointerMoved += OnPanelHandlePointerMoved;
            resize.PointerReleased += OnPanelHandlePointerReleased;
            resize.PointerCanceled += OnPanelHandlePointerCanceled;
            Grid.SetRow(resize, 1);
            root.Children.Add(resize);
            ToolTipService.SetToolTip(resize, W("拖动调整尺寸", "Drag to resize", "ドラッグしてサイズ変更"));
        }

        border.Child = root;
        return border;
    }'''
          s = replace_block(s, '    private Border CreateTile(ProjectWorkspacePanel panel, double width, double height)', 'private FlyoutBase CreatePanelMenu(ProjectWorkspacePanel panel)', create_tile)

          panel_menu = r'''private FlyoutBase CreatePanelMenu(ProjectWorkspacePanel panel)
    {
        var menu = new MenuFlyout();
        var edit = new MenuFlyoutItem
        {
            Text = W("编辑内容", "Edit content", "内容を編集"),
            Tag = panel.Id,
            IsEnabled = _project is { IsArchived: false }
        };
        edit.Click += OnEditPanelContent;
        menu.Items.Add(edit);

        var settings = new MenuFlyoutItem
        {
            Text = W("面板设置", "Panel settings", "パネル設定"),
            Tag = panel.Id,
            IsEnabled = _project is { IsArchived: false }
        };
        settings.Click += OnPanelSettings;
        menu.Items.Add(settings);

        if (_project is { IsArchived: false })
        {
            menu.Items.Add(new MenuFlyoutSeparator());
            var delete = new MenuFlyoutItem { Text = W("删除面板", "Remove panel", "パネルを削除"), Tag = panel.Id };
            delete.Click += OnRemovePanel;
            menu.Items.Add(delete);
