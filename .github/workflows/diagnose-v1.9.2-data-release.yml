name: Diagnose Data Pack 1.0 release

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-v1.9.2-data-release.yml'

permissions:
  contents: read

jobs:
  verify-release-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Download, verify and inventory published packs
        shell: bash
        run: |
          set -euo pipefail
          base='https://github.com/KiYouJyo/UrbanPlanToolbox_Data/releases/download/data-2026.08.1'
          declare -A expected_sha=(
            [design-concepts]='f7b257780ae646a1634f71b8a269c546c78b173ca069671fea0bc16e9185a678'
            [planning-regulations]='4e08355d240c06ae24c299a8fd10361cb8e5752957f6e1536b715c0e4a7020f4'
            [planning-terminology]='db192b722af918c85355842de1ce55842933fda228b1a24a5b02fd276cb37ca4'
          )
          declare -A expected_size=(
            [design-concepts]='8485'
            [planning-regulations]='19496'
            [planning-terminology]='51279'
          )
          for id in design-concepts planning-regulations planning-terminology; do
            file="${id}-2026.08.1.uptdata"
            echo "=== $file ==="
            curl --fail --location --retry 2 --retry-delay 1 --silent --show-error "$base/$file" --output "$file"
            actual_size="$(stat -c%s "$file")"
            actual_sha="$(sha256sum "$file" | awk '{print $1}')"
            echo "size=$actual_size sha256=$actual_sha"
            test "$actual_size" = "${expected_size[$id]}"
            test "$actual_sha" = "${expected_sha[$id]}"
            unzip -t "$file"
            python - "$file" "$id" <<'PY'
          import hashlib, json, sys, zipfile
          path, expected_id = sys.argv[1:]
          with zipfile.ZipFile(path) as archive:
              manifest = json.loads(archive.read('manifest.json'))
              assert manifest['id'] == expected_id
              assert manifest['version'] == '2026.08.1'
              assert manifest['schemaVersion'] == 1
              assert manifest['minAppVersion'] == '1.9.2'
              assert manifest['publisher'] == 'UrbanPlanToolbox'
              files = manifest['files']
              assert len(files) == 1
              payload_bytes = archive.read(files[0]['path'])
              assert files[0]['size'] == len(payload_bytes)
              assert files[0]['sha256'].lower() == hashlib.sha256(payload_bytes).hexdigest()
              payload = json.loads(payload_bytes)
              assert payload['schemaVersion'] == 1
              assert payload['dataVersion'] == '2026.08.1'
              collection = payload['terms'] if expected_id == 'planning-terminology' else payload['entries']
              assert collection
              if expected_id == 'planning-regulations':
                  string_fields = ('stableId','region','jurisdictionLevel','topic','documentLevel','originalTitle','chineseTitle','scopeAndPurpose','effectOrAdoption','officialUrl','verifiedDate')
                  nullable_string_fields = ('identifierOrYear','downloadUrl','downloadAndCopyrightNote','searchKeywords')
                  for index, item in enumerate(collection):
                      assert isinstance(item.get('id'), int), (index, 'id', item.get('id'))
                      for key in string_fields:
                          assert isinstance(item.get(key), str) and item[key].strip(), (index, key, item.get(key), type(item.get(key)).__name__)
                      for key in nullable_string_fields:
                          assert item.get(key) is None or isinstance(item.get(key), str), (index, key, item.get(key), type(item.get(key)).__name__)
                  assert len({item['stableId'] for item in collection}) == len(collection)
                  print('FILTER regions=' + ' | '.join(sorted({item['region'] for item in collection})))
                  print('FILTER topics=' + ' | '.join(sorted({item['topic'] for item in collection})))
              elif expected_id == 'planning-terminology':
                  print('FILTER jurisdictions=' + ' | '.join(sorted({item['jurisdiction'] for item in collection})))
                  print('FILTER categories=' + ' | '.join(sorted({item['category'] for item in collection})))
              else:
                  print('FILTER projectTypes=' + ' | '.join(sorted({value for item in collection for value in item.get('projectTypes', [])})))
                  print('FILTER tags=' + ' | '.join(sorted({value for item in collection for value in item.get('tags', [])})))
              print(f"{expected_id}: payload entries={len(collection)}")
          PY
          done
