name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Three-part product version, for example 1.5.9'
        required: true
        type: string
      dry_run:
        description: 'Build, sign, and validate without creating or modifying a Release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-2025-vs2026
    env:
      RELEASE_CERTIFICATE_BASE64: ${{ secrets.GH_RELEASE_CERTIFICATE_BASE64 }}
      RELEASE_CERTIFICATE_PASSWORD: ${{ secrets.GH_RELEASE_CERTIFICATE_PASSWORD }}
    steps:
      - name: Resolve version and source ref
        id: version
        shell: pwsh
        run: |
          $isTag = '${{ github.event_name }}' -eq 'push'
          $tagVersion = if ($isTag) { '${{ github.ref_name }}'.TrimStart('v') } else { '${{ inputs.version }}' }
          if ($tagVersion -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid release version: $tagVersion" }
          $sourceRef = "refs/tags/v$tagVersion"
          "version=$tagVersion" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "package_version=$tagVersion.0" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "source_ref=$sourceRef" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "dry_run=$('${{ inputs.dry_run }}')" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.version.outputs.source_ref }}
          fetch-depth: 0

      - name: Validate source version and tag
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: |
          $tagCommit = (git rev-list -n 1 "refs/tags/v$env:RELEASE_VERSION")
          $headCommit = (git rev-parse HEAD)
          if ($tagCommit -ne $headCommit) { throw "Checked out commit does not match tag. Tag=$tagCommit HEAD=$headCommit" }
          [xml]$project = Get-Content -Raw UrbanPlanToolbox.csproj
          $projectVersion = @($project.Project.PropertyGroup | ForEach-Object Version | Where-Object { $_ })[0]
          $appVersion = (Get-Content Services/AppVersionProvider.cs -Raw | Select-String 'Version = "([^"]+)"' -AllMatches).Matches[0].Groups[1].Value
          [xml]$manifest = Get-Content -Raw Package.appxmanifest
          $manifestVersion = $manifest.Package.Identity.Version
          if ($projectVersion -ne $env:RELEASE_VERSION -or $appVersion -ne $env:RELEASE_VERSION -or $manifestVersion -ne $env:PACKAGE_VERSION) { throw "Source version mismatch. Project=$projectVersion App=$appVersion Manifest=$manifestVersion Expected=$env:RELEASE_VERSION/$env:PACKAGE_VERSION" }

      - name: Validate signing configuration
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_CERTIFICATE_BASE64) -or [string]::IsNullOrWhiteSpace($env:RELEASE_CERTIFICATE_PASSWORD)) { throw 'GitHub release signing secrets are not configured.' }

      - name: Restore and test
        shell: pwsh
        run: |
          dotnet restore UrbanPlanToolbox.slnx -p:Configuration=Release -p:Platform=x64
          dotnet test UrbanPlanToolbox.slnx -c Release -p:Platform=x64 --no-restore

      - name: Build unsigned x64 MSIX bundle
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'UrbanPlanToolbox-AppPackages'
          dotnet build UrbanPlanToolbox.csproj -c Release -p:Platform=x64 -p:GenerateAppxPackageOnBuild=true -p:AppxPackageSigningEnabled=false -p:AppxBundle=Always -p:AppxBundlePlatforms=x64 -p:UapAppxPackageBuildMode=SideloadOnly -p:AppxPackageDir="$output\"
          $bundle = @(Get-ChildItem $output -Recurse -Filter '*.msixbundle') | Select-Object -First 1
          if (-not $bundle) { throw 'MSIX bundle was not produced.' }
          $expected = "UrbanPlanToolbox_${{ steps.version.outputs.package_version }}_x64.msixbundle"
          if ($bundle.Name -ne $expected) { throw "Unexpected bundle name: $($bundle.Name); expected $expected" }
          "BUNDLE_PATH=$($bundle.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "BUNDLE_FILE_NAME=$($bundle.Name)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Sign bundle and export public certificate
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'UrbanPlanToolbox-ReleaseAssets'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $pfx = Join-Path $work 'release-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:RELEASE_CERTIFICATE_BASE64))
          $securePassword = ConvertTo-SecureString $env:RELEASE_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword
          if ($certificate.Subject -cne 'CN=AppPublisher' -or $certificate.Thumbprint -cne 'BD85AD77A651C86CA01A480C8E9BC64952993F98' -or -not $certificate.HasPrivateKey) { throw "Unexpected signing certificate: Subject=$($certificate.Subject); Thumbprint=$($certificate.Thumbprint); HasPrivateKey=$($certificate.HasPrivateKey)" }
          $cer = Join-Path $work "UrbanPlanToolbox-${{ steps.version.outputs.version }}-Framework-Dependent.cer"
          Export-Certificate -Cert $certificate -FilePath $cer | Out-Null
          $kitsRoot = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          if ([string]::IsNullOrWhiteSpace($kitsRoot)) { throw 'ProgramFiles(x86) environment variable is unavailable.' }
          $signtool = Get-ChildItem (Join-Path $kitsRoot 'Windows Kits\10\bin') -Recurse -Filter signtool.exe | Where-Object FullName -match '\\x64\\signtool.exe$' | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'x64 signtool.exe was not found.' }
          Write-Output "Windows Kits root: $kitsRoot"
          Write-Output "signtool path: $($signtool.FullName)"
          & $signtool.FullName sign /fd SHA256 /sha1 $certificate.Thumbprint /tr http://timestamp.digicert.com /td SHA256 $env:BUNDLE_PATH
          if ($LASTEXITCODE -ne 0) { throw "signtool sign failed: $LASTEXITCODE" }
          $signature = Get-AuthenticodeSignature -FilePath $env:BUNDLE_PATH
          if (-not $signature.SignerCertificate) { throw "Signed bundle has no Authenticode signer certificate. Status=$($signature.Status)" }
          if ($signature.SignerCertificate.Subject -cne 'CN=AppPublisher' -or $signature.SignerCertificate.Thumbprint -cne $certificate.Thumbprint) { throw "Signed bundle signer mismatch: Subject=$($signature.SignerCertificate.Subject); Thumbprint=$($signature.SignerCertificate.Thumbprint)" }
          if ($signature.Status -notin @('Valid', 'Unknown')) { throw "Signed bundle Authenticode status is not acceptable: $($signature.Status) / $($signature.StatusMessage)" }
          Write-Output "Authenticode signer verified: $($signature.SignerCertificate.Subject) / $($signature.SignerCertificate.Thumbprint); status=$($signature.Status)"
          "CERTIFICATE_PATH=$cer" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Generate and validate final one-click package
        shell: pwsh
        run: |
          $assets = Join-Path $env:RUNNER_TEMP 'UrbanPlanToolbox-ReleaseAssets'
          $staging = Join-Path $assets 'staging'
          & ./packaging/New-GitHubOneClickInstallerPackage.ps1 -SignedBundlePath $env:BUNDLE_PATH -PublicCertificatePath $env:CERTIFICATE_PATH -OutputDirectory $staging -DisplayVersion '${{ steps.version.outputs.version }}' -PackageVersion '${{ steps.version.outputs.package_version }}'
          $packageRoot = Join-Path $staging "UrbanPlanToolbox-v${{ steps.version.outputs.version }}-x64-one-click"
          & ./packaging/Test-GitHubOneClickInstallerPackage.ps1 -ReleaseDirectory $packageRoot
          $zip = Join-Path $assets "UrbanPlanToolbox-v${{ steps.version.outputs.version }}-x64-one-click.zip"
          Compress-Archive -LiteralPath $packageRoot -DestinationPath $zip -CompressionLevel Optimal
          $extracted = Join-Path $assets 'extracted'
          Expand-Archive -LiteralPath $zip -DestinationPath $extracted -Force
          & ./packaging/Test-GitHubOneClickInstallerPackage.ps1 -ReleaseDirectory (Join-Path $extracted "UrbanPlanToolbox-v${{ steps.version.outputs.version }}-x64-one-click") -ZipPath $zip
          Copy-Item -LiteralPath $env:BUNDLE_PATH -Destination (Join-Path $assets $env:BUNDLE_FILE_NAME) -Force

      - name: Prepare and validate SHA256 manifest
        shell: pwsh
        run: |
          $assets = Join-Path $env:RUNNER_TEMP 'UrbanPlanToolbox-ReleaseAssets'
          $releaseFiles = @((Join-Path $assets "UrbanPlanToolbox-v${{ steps.version.outputs.version }}-x64-one-click.zip"),(Join-Path $assets $env:BUNDLE_FILE_NAME))
          $manifest = foreach ($file in $releaseFiles) { $item = Get-Item -LiteralPath $file; "{0}  {1}" -f (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant(), $item.Name }
          Set-Content -LiteralPath (Join-Path $assets 'SHA256SUMS.txt') -Value $manifest -Encoding ascii
          $parsed = Get-Content (Join-Path $assets 'SHA256SUMS.txt')
          foreach ($line in $parsed) { if ($line -notmatch '^[a-f0-9]{64}  .+$') { throw "Invalid SHA256 manifest line: $line" } }

      - name: Resolve release notes
        shell: pwsh
        run: |
          $notes = "docs/RELEASE-NOTES-v${{ steps.version.outputs.version }}.md"
          if (Test-Path $notes) { Copy-Item $notes (Join-Path $env:RUNNER_TEMP 'release-notes.md') -Force }
          else {
            git fetch origin main --no-tags
            $notesText = git show "origin/main:$notes"
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($notesText)) { throw "Release notes not found: $notes" }
            Set-Content (Join-Path $env:RUNNER_TEMP 'release-notes.md') -Value $notesText -Encoding utf8
          }
          if ((Get-Content (Join-Path $env:RUNNER_TEMP 'release-notes.md') -Raw) -match '`n|\\n') { throw 'Release notes contain literal newline escapes.' }

      - name: Create or reconcile GitHub Release
        if: steps.version.outputs.dry_run != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'; $tag = "v$version"; $assets = Join-Path $env:RUNNER_TEMP 'UrbanPlanToolbox-ReleaseAssets'
          $releaseJson = gh api "repos/${{ github.repository }}/releases/tags/$tag" 2>$null
          if ($LASTEXITCODE -eq 0 -and $releaseJson) { $release = $releaseJson | ConvertFrom-Json }
          else {
            gh release create $tag --verify-tag --title "UrbanPlanToolbox $tag" --notes-file (Join-Path $env:RUNNER_TEMP 'release-notes.md')
            if ($LASTEXITCODE -ne 0) { throw "GitHub Release creation failed: $LASTEXITCODE" }
            $release = (gh api "repos/${{ github.repository }}/releases/tags/$tag") | ConvertFrom-Json
          }
          $expected = @("UrbanPlanToolbox_${version}.0_x64.msixbundle", "UrbanPlanToolbox-v$version-x64-one-click.zip", 'SHA256SUMS.txt')
          $localFiles = @((Join-Path $assets $expected[0]),(Join-Path $assets $expected[1]),(Join-Path $assets $expected[2]))
          $remote = gh api "repos/${{ github.repository }}/releases/$($release.id)/assets" | ConvertFrom-Json
          foreach($name in $expected) {
            $local = Get-Item -LiteralPath (Join-Path $assets $name)
            $existing = @($remote | Where-Object name -eq $name)
            if($existing.Count -gt 0) {
              $localHash = (Get-FileHash $local.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              if($existing[0].digest -and $existing[0].digest -ne "sha256:$localHash") { throw "Existing asset hash conflict: $name" }
              continue
            }
            gh release upload $tag $local.FullName
          }

      - name: Upload release asset artifact
        uses: actions/upload-artifact@v4
        with:
          name: UrbanPlanToolbox-${{ steps.version.outputs.version }}-github-release-assets
          path: |
            ${{ runner.temp }}/UrbanPlanToolbox-ReleaseAssets/UrbanPlanToolbox-v${{ steps.version.outputs.version }}-x64-one-click.zip
            ${{ runner.temp }}/UrbanPlanToolbox-ReleaseAssets/*.msixbundle
            ${{ runner.temp }}/UrbanPlanToolbox-ReleaseAssets/SHA256SUMS.txt
          if-no-files-found: error
