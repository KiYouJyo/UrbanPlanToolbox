name: Publish GitHub Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Three-part product version, for example 1.5.6'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-test-package:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore and test
        shell: pwsh
        run: |
          dotnet restore UrbanPlanToolbox.slnx -p:Configuration=Release -p:Platform=x64
          dotnet test UrbanPlanToolbox.slnx -c Release -p:Platform=x64 --no-restore
      - name: Build x64 MSIX bundle
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'UrbanPlanToolbox-AppPackages'
          dotnet build UrbanPlanToolbox.csproj -c Release -p:Platform=x64 -p:GenerateAppxPackageOnBuild=true -p:AppxPackageSigningEnabled=false -p:AppxBundle=Always -p:AppxBundlePlatforms=x64 -p:UapAppxPackageBuildMode=SideloadOnly -p:AppxPackageDir="$output\"
          $bundle = Get-ChildItem $output -Recurse -Filter '*.msixbundle' | Select-Object -First 1
          if (-not $bundle) { throw 'MSIX bundle was not produced.' }
          $installer = Join-Path $output 'UrbanPlanToolbox.appinstaller'
          & ./packaging/New-AppInstallerFile.ps1 -OutputPath $installer -DisplayVersion '${{ inputs.version }}' -BundleFileName $bundle.Name
          & ./packaging/Test-AppInstallerFile.ps1 -Path $installer -ExpectedVersion '${{ inputs.version }}' -ExpectedBundleFileName $bundle.Name
