name: Retry Microsoft Store v1.7.3 publication

on:
  push:
    branches:
      - main
    paths:
      - 'packaging/store-release-notes/1.7.3.json'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch corrected Microsoft Store publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh workflow run publish-microsoft-store.yml --repo "${{ github.repository }}" --ref main \
            -f source_ref="$SOURCE_SHA" \
            -f publication_confirmation="PUBLISH 1.7.3"
